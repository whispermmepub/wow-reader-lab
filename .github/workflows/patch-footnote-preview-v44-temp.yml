name: Patch WoW Reader Lab v44 footnote preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-footnote-preview-v44-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Apply v44 footnote preview patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rpath=Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java')
          gpath=Path('app/build.gradle')
          r=rpath.read_text()
          g=gpath.read_text()

          def once(text, old, new, label):
              c=text.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {c}')
              return text.replace(old,new,1)

          g=once(g, 'versionCode 43', 'versionCode 44', 'versionCode')
          g=once(g, "versionName '2.17.3'", "versionName '2.17.4'", 'versionName')

          fields='''    private long footnoteArmToken = 0L;\n'''
          fields_new='''    private long footnoteArmToken = 0L;\n    private Dialog footnotePreviewDialog = null;\n    private String footnotePreviewHref = "";\n    private String footnotePreviewLabel = "";\n'''
          r=once(r, fields, fields_new, 'footnote preview fields')

          old_listener='''                "var role=a.getAttribute('role')||'',rel=a.getAttribute('rel')||'',cls=(typeof a.className==='string'?a.className:'');" +\n                "var sid='',n=a;for(var i=0;i<5&&n;i++,n=n.parentElement){if(n.id){sid=n.id;break;}}" +\n                "if(WoW.onReaderLinkTap(href,ep,role,rel,cls,sid)){ev.preventDefault();ev.stopImmediatePropagation();return false;}" +'''
          new_listener='''                "var role=a.getAttribute('role')||'',rel=a.getAttribute('rel')||'',cls=(typeof a.className==='string'?a.className:'');" +\n                "var sid='',n=a;for(var i=0;i<5&&n;i++,n=n.parentElement){if(n.id){sid=n.id;break;}}" +\n                "var label=(a.textContent||'').replace(/\\s+/g,' ').trim();" +\n                "if(WoW.onReaderLinkTap(href,ep,role,rel,cls,sid,label)){ev.preventDefault();ev.stopImmediatePropagation();return false;}" +'''
          r=once(r, old_listener, new_listener, 'link listener label')

          anchor='''    private static String navLower(String value) {\n        return value == null ? "" : value.toLowerCase(Locale.ROOT);\n    }\n'''
          preview_methods='''    private void requestFootnotePreview(String href, String label) {\n        if (webView == null || href == null || href.trim().isEmpty()) return;\n        footnotePreviewHref = href.trim();\n        footnotePreviewLabel = label == null ? "" : label.trim();\n        runOnUiThread(() -> {\n            if (webView == null) return;\n            String script = "(function(){try{" +\n                    "var raw=" + jsQuote(footnotePreviewHref) + ";var abs=new URL(raw,location.href).href;var u=new URL(abs);" +\n                    "var frag='';try{frag=decodeURIComponent((u.hash||'').replace(/^#/,''));}catch(_e){frag=(u.hash||'').replace(/^#/,'');}" +\n                    "var textOf=function(doc){try{var n=frag?doc.getElementById(frag):null;if(!n&&frag){try{n=doc.querySelector('[name=\\\"'+CSS.escape(frag)+'\\\"]');}catch(_e){}}" +\n                    "if(!n)return '';var c=n.cloneNode(true);var backs=c.querySelectorAll('a[epub\\:type*=backlink],a[role=doc-backlink],a[href*=ref],a[href*=back]');for(var i=0;i<backs.length;i++)backs[i].remove();" +\n                    "return (c.innerText||c.textContent||'').replace(/\\s+/g,' ').trim();}catch(e){return '';}};" +\n                    "var here=location.href.split('#')[0],there=abs.split('#')[0];" +\n                    "if(here===there){WoW.onFootnotePreviewResolved(abs,textOf(document));return true;}" +\n                    "fetch(there).then(function(x){return x.text();}).then(function(t){var d=(new DOMParser()).parseFromString(t,'text/html');WoW.onFootnotePreviewResolved(abs,textOf(d));})" +\n                    ".catch(function(){WoW.onFootnotePreviewResolved(abs,'');});return true;}catch(e){WoW.onFootnotePreviewResolved(" + jsQuote(footnotePreviewHref) + ",'');return false;}})()";\n            try { webView.evaluateJavascript(script, null); } catch (Exception ignored) {\n                showFootnotePreview(footnotePreviewHref, footnotePreviewLabel, "");\n            }\n        });\n    }\n\n    private void showFootnotePreview(String href, String label, String bodyText) {\n        if (isFinishing()) return;\n        if (footnotePreviewDialog != null) {\n            try { footnotePreviewDialog.dismiss(); } catch (Exception ignored) {}\n            footnotePreviewDialog = null;\n        }\n\n        final Dialog dialog = new Dialog(this);\n        footnotePreviewDialog = dialog;\n        dialog.requestWindowFeature(Window.FEATURE_NO_TITLE);\n        dialog.setCanceledOnTouchOutside(true);\n\n        LinearLayout card = new LinearLayout(this);\n        card.setOrientation(LinearLayout.VERTICAL);\n        card.setPadding(dp(20), dp(16), dp(20), dp(18));\n        card.setBackground(roundRect(readerPanelBase(), dp(24), dp(1), readerPanelStroke()));\n\n        LinearLayout head = new LinearLayout(this);\n        head.setOrientation(LinearLayout.HORIZONTAL);\n        head.setGravity(Gravity.CENTER_VERTICAL);\n        TextView title = new TextView(this);\n        String cleanLabel = label == null ? "" : label.trim();\n        title.setText(cleanLabel.isEmpty() ? "Footnote" : "Footnote " + cleanLabel);\n        title.setTextSize(17f);\n        title.setTypeface(android.graphics.Typeface.DEFAULT, android.graphics.Typeface.BOLD);\n        title.setTextColor(readerPanelText());\n        head.addView(title, new LinearLayout.LayoutParams(0, dp(42), 1f));\n        TextView close = new TextView(this);\n        close.setText("×");\n        close.setTextSize(25f);\n        close.setTextColor(readerPanelSubText());\n        close.setGravity(Gravity.CENTER);\n        close.setContentDescription("Close footnote");\n        close.setOnClickListener(v -> dialog.dismiss());\n        head.addView(close, new LinearLayout.LayoutParams(dp(42), dp(42)));\n        card.addView(head);\n\n        ScrollView scroll = new ScrollView(this);\n        scroll.setVerticalScrollBarEnabled(false);\n        TextView body = new TextView(this);\n        String text = bodyText == null ? "" : bodyText.replaceAll("\\s+", " ").trim();\n        if (text.length() > 6000) text = text.substring(0, 6000).trim() + "…";\n        if (text.isEmpty()) text = "Open the footnote to read the full note.";\n        body.setText(text);\n        body.setTextSize(15.5f);\n        body.setTextColor(readerPanelText());\n        body.setLineSpacing(dp(3), 1.08f);\n        body.setPadding(dp(2), dp(4), dp(2), dp(10));\n        scroll.addView(body, new ScrollView.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));\n        int maxBody = Math.max(dp(120), (int)(getResources().getDisplayMetrics().heightPixels * 0.38f));\n        card.addView(scroll, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, maxBody));\n\n        LinearLayout actions = new LinearLayout(this);\n        actions.setOrientation(LinearLayout.HORIZONTAL);\n        actions.setGravity(Gravity.END | Gravity.CENTER_VERTICAL);\n        actions.setPadding(0, dp(10), 0, 0);\n        TextView dismiss = new TextView(this);\n        dismiss.setText("Close");\n        dismiss.setTextSize(14f);\n        dismiss.setTypeface(android.graphics.Typeface.DEFAULT, android.graphics.Typeface.BOLD);\n        dismiss.setTextColor(readerPanelSubText());\n        dismiss.setGravity(Gravity.CENTER);\n        dismiss.setPadding(dp(16), 0, dp(16), 0);\n        dismiss.setOnClickListener(v -> dialog.dismiss());\n        actions.addView(dismiss, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(44)));\n\n        TextView go = new TextView(this);\n        go.setText("Go to note  ›");\n        go.setTextSize(14f);\n        go.setTypeface(android.graphics.Typeface.DEFAULT, android.graphics.Typeface.BOLD);\n        go.setTextColor(readerAccent());\n        go.setGravity(Gravity.CENTER);\n        go.setPadding(dp(18), 0, dp(18), 0);\n        go.setBackground(roundRect(readerSelectedSurface(), dp(20), dp(1), readerPanelStroke()));\n        go.setOnClickListener(v -> { dialog.dismiss(); navigateToFootnote(href); });\n        LinearLayout.LayoutParams goLp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(44));\n        goLp.leftMargin = dp(8);\n        actions.addView(go, goLp);\n        card.addView(actions);\n\n        dialog.setContentView(card);\n        dialog.setOnDismissListener(d -> { if (footnotePreviewDialog == dialog) footnotePreviewDialog = null; });\n        dialog.show();\n        Window w = dialog.getWindow();\n        if (w != null) {\n            w.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));\n            w.setDimAmount(0.30f);\n            w.addFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND);\n            w.setGravity(Gravity.BOTTOM);\n            w.setLayout(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);\n            WindowManager.LayoutParams lp = w.getAttributes();\n            lp.width = ViewGroup.LayoutParams.MATCH_PARENT;\n            lp.height = ViewGroup.LayoutParams.WRAP_CONTENT;\n            lp.gravity = Gravity.BOTTOM;\n            w.setAttributes(lp);\n        }\n    }\n\n    private void navigateToFootnote(String href) {\n        if (webView == null || href == null || href.trim().isEmpty()) return;\n        footnoteNavigationActive = true;\n        footnoteReturnArmed = false;\n        footnoteArmToken++;\n        String script = "(function(){try{location.href=new URL(" + jsQuote(href.trim()) + ",location.href).href;return true;}catch(e){return false;}})()";\n        try { webView.evaluateJavascript(script, null); } catch (Exception ignored) {}\n    }\n\n''' + anchor
          r=once(r, anchor, preview_methods, 'preview methods')

          old_bridge='''        @JavascriptInterface\n        public boolean onReaderLinkTap(String href, String epubType, String role, String rel, String cssClass, String sourceId) {\n            if (owner != webView) return false;\n            if (looksLikeFootnoteReference(href, epubType, role, rel, cssClass)) {\n                armFootnoteReturn(sourceId);\n                return false;\n            }\n            if (footnoteNavigationActive && looksLikeFootnoteBacklink(href, epubType, role, rel, cssClass)) {\n                restoreFootnoteReturn();\n                return true;\n            }\n            return false;\n        }\n'''
          new_bridge='''        @JavascriptInterface\n        public boolean onReaderLinkTap(String href, String epubType, String role, String rel, String cssClass, String sourceId, String label) {\n            if (owner != webView) return false;\n            if (looksLikeFootnoteReference(href, epubType, role, rel, cssClass)) {\n                armFootnoteReturn(sourceId);\n                requestFootnotePreview(href, label);\n                return true;\n            }\n            if (footnoteNavigationActive && looksLikeFootnoteBacklink(href, epubType, role, rel, cssClass)) {\n                restoreFootnoteReturn();\n                return true;\n            }\n            return false;\n        }\n\n        @JavascriptInterface\n        public void onFootnotePreviewResolved(String href, String text) {\n            if (owner != webView) return;\n            final String target = href == null || href.trim().isEmpty() ? footnotePreviewHref : href.trim();\n            final String body = text == null ? "" : text;\n            runOnUiThread(() -> showFootnotePreview(target, footnotePreviewLabel, body));\n        }\n'''
          r=once(r, old_bridge, new_bridge, 'bridge preview')

          rpath.write_text(r)
          gpath.write_text(g)
          PY

          grep -q 'versionCode 44' app/build.gradle
          grep -q "versionName '2.17.4'" app/build.gradle
          grep -q 'requestFootnotePreview' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'Go to note' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'onFootnotePreviewResolved' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'footnoteNavigationActive' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'ReadingProgressStore.set' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'SwipeRefreshLayout' app/src/main/java/com/whisper/wowreader/MainActivity.java
          git diff --check
      - name: Build and lint v44
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace
      - name: Smoke check v44
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='44'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.4'"
      - name: Commit verified v44 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git diff --cached --quiet && exit 0
          git commit -m "Add Play Books style footnote preview"
          git push origin HEAD:main
