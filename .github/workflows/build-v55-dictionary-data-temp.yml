name: Probe v55 dictionary source links

on:
  push:
    branches: [feature/v55-inapp-dictionary]
    paths:
      - '.github/workflows/build-v55-dictionary-data-temp.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v55-inapp-dictionary
      - name: Inspect Kaikki category chunk download links
        shell: bash
        run: |
          python3 - <<'PY'
          import html,re,urllib.parse,urllib.request
          UA={'User-Agent':'WoW-Reader-dictionary-builder/1.0 (+https://github.com/whispermmepub/wow-reader-lab)'}
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=60) as r:
                  print('GET',r.status,r.headers.get('content-type'),r.geturl())
                  return r.read()
          base='https://kaikki.org/dictionary/English/categories-other/my/Terms%20with%20Burmese%20translations/'
          index=base+'index.html'
          body=get(index).decode('utf-8','replace')
          hrefs=[]
          for h in re.findall(r'href=["\']([^"\']+\.html)["\']',body,re.I):
              h=html.unescape(h)
              if '--' in urllib.parse.unquote(h.rsplit('/',1)[-1]) and h not in hrefs: hrefs.append(h)
          print('chunk count',len(hrefs))
          print('first href',hrefs[0])
          page=urllib.parse.urljoin(index,hrefs[0])
          page_body=get(page).decode('utf-8','replace')
          print('page',page,'bytes',len(page_body))
          links=[]
          for h in re.findall(r'href=["\']([^"\']+)["\']',page_body,re.I):
              h=html.unescape(h)
              if any(x in h.lower() for x in ('json','download','raw','jl','gz')):
                  if h not in links: links.append(h)
          print('interesting links:')
          for h in links[:100]: print(repr(h), '=>', urllib.parse.urljoin(page,h))
          print('lines mentioning json/download/raw:')
          for line in page_body.splitlines():
              low=line.lower()
              if 'json' in low or 'download' in low or 'raw' in low:
                  print(line[:2000])
          print('script/src links:')
          for h in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',page_body,re.I):
              if h not in links: print(repr(h))
          PY
