name: Verify v58 reader stability fixes
on:
  push:
    branches: [feature/v58-reader-stability]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v58-reader-stability
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true
      - name: Apply v58 fixes
        run: python3 .github/scripts/apply_v58_fixes.py
      - name: Source checks
        run: |
          set -euo pipefail
          grep -q 'versionCode 58' app/build.gradle
          grep -q "versionName '2.18.8'" app/build.gradle
          ! grep -q 'execSQL("PRAGMA journal_mode=DELETE")' app/src/main/java/com/whisper/wowreader/KindleDictionaryStore.java
          grep -q 'Math.max(1, Math.min(20, lines))' app/src/main/java/com/whisper/wowreader/ReadingRulerView.java
          grep -q 'Choose from 1 to 20 text lines' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'effectiveProgress = 1000' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'adaptiveReaderMarginCssPx' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'pdfSettingsDialog.setOnDismissListener' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'authorizeSilently(new GoogleDriveSync.AuthCallback' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'isAtDocumentEnd()' app/src/main/java/com/whisper/wowreader/PdfContinuousView.java
      - name: Build tests and lint
        run: gradle :app:clean :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --stacktrace
      - name: Verify APK identity
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='58'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.8'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
      - name: Collect APKs
        run: |
          cp $(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1) WoW-Reader-v2.18.8-v58-debug.apk
          cp $(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1) WoW-Reader-v2.18.8-v58-unsigned-release.apk
          sha256sum WoW-Reader-v2.18.8-v58-debug.apk WoW-Reader-v2.18.8-v58-unsigned-release.apk > v58-sha256.txt
      - name: Commit verified v58 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/com/whisper/wowreader/KindleDictionaryStore.java app/src/main/java/com/whisper/wowreader/ReadingRulerView.java app/src/main/java/com/whisper/wowreader/PdfContinuousView.java app/src/main/java/com/whisper/wowreader/MainActivity.java app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git rm -f .github/scripts/apply_v58_fixes.py .github/workflows/build-v58-fixes-temp.yml
          git rm -f .github/workflows/build-v57-signed-test-temp.yml .github/workflows/build-v57-unsigned-release-temp.yml || true
          git commit -m 'Fix v58 reader stability and Kindle dictionary import'
          git push origin HEAD:feature/v58-reader-stability
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.18.8-v58-test-builds
          path: |
            WoW-Reader-v2.18.8-v58-debug.apk
            WoW-Reader-v2.18.8-v58-unsigned-release.apk
            v58-sha256.txt
          retention-days: 7
