name: Build v55 in-app dictionary test

on:
  push:
    branches: [feature/v55-inapp-dictionary]
    paths:
      - '.github/workflows/build-v55-dictionary-test-temp.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v55-inapp-dictionary
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Integrate Kindle-style dictionary and bump v55
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java')
          s=p.read_text(encoding='utf-8')
          new_show='''    private void showTranslateDialog(String text) {\n        DictionaryDialog.show(this, text);\n    }\n'''
          s,n=re.subn(r'(?ms)^    private void showTranslateDialog\(String text\) \{.*?^    \}\n',new_show,s,count=1)
          if n != 1: raise SystemExit('showTranslateDialog replacement failed')
          new_open='''    private void openTranslation(String text, String targetLanguage) {\n        DictionaryDialog.show(this, text);\n    }\n'''
          s,n=re.subn(r'(?ms)^    private void openTranslation\(String text, String targetLanguage\) \{.*?^    \}\n',new_open,s,count=1)
          if n != 1: raise SystemExit('openTranslation replacement failed')
          s=s.replace('"Translate"', '"Dictionary"')
          p.write_text(s,encoding='utf-8')
          g=Path('app/build.gradle')
          t=g.read_text(encoding='utf-8')
          t,n1=re.subn(r'versionCode\s+54\b','versionCode 55',t,count=1)
          t,n2=re.subn(r"versionName\s+'2\.18\.4'","versionName '2.18.5'",t,count=1)
          if n1 != 1 or n2 != 1: raise SystemExit('version bump failed')
          g.write_text(t,encoding='utf-8')
          PY
          grep -q 'DictionaryDialog.show(this, text)' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          ! grep -R 'translate.google.com' app/src/main/java/com/whisper/wowreader
          grep -q 'versionCode 55' app/build.gradle
          grep -q "versionName '2.18.5'" app/build.gradle

      - name: Dictionary data smoke checks
        run: |
          test -s app/src/main/assets/dictionary/wow_dictionary.db
          sqlite3 app/src/main/assets/dictionary/wow_dictionary.db 'select direction,count(*) from entries group by direction order by direction;'
          test "$(sqlite3 app/src/main/assets/dictionary/wow_dictionary.db 'select count(*) from entries where direction=0;')" -gt 5000
          test "$(sqlite3 app/src/main/assets/dictionary/wow_dictionary.db 'select count(*) from entries where direction=1;')" -gt 10000

      - name: Build release APK AAB debug and lint
        run: gradle :app:assembleRelease :app:bundleRelease :app:assembleDebug :app:lintRelease --stacktrace

      - name: APK smoke checks
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          unzip -l "$APK" | grep -q 'assets/dictionary/wow_dictionary.db'
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep "package: name='com.whisper.wowreader' versionCode='55' versionName='2.18.5'"

      - name: Collect test artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/WoW-Reader-v2.18.5-v55-dictionary-unsigned.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/WoW-Reader-v2.18.5-v55-dictionary-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab out/WoW-Reader-v2.18.5-v55-dictionary-unsigned.aab
          cp app/src/main/assets/dictionary/NOTICE.md out/DICTIONARY-NOTICE.md
          cp tools/dictionary-build-report.txt out/dictionary-build-report.txt
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          cp "$APKSIGNER_JAR" out/apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.18.5-v55-dictionary-test
          path: out/*
          if-no-files-found: error

      - name: Commit v55 source and remove temporary builder
        if: success()
        shell: bash
        run: |
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git rm .github/workflows/build-v55-dictionary-test-temp.yml
          git add app/build.gradle app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/src/main/java/com/whisper/wowreader/DictionaryDialog.java
          git commit -m 'Add in-app offline and online English Myanmar dictionary'
          git push origin HEAD:feature/v55-inapp-dictionary
