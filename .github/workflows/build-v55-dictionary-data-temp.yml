name: Probe v55 category translation payload

on:
  push:
    branches: [feature/v55-inapp-dictionary]
    paths:
      - '.github/workflows/build-v55-dictionary-data-temp.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v55-inapp-dictionary
      - name: Inspect Burmese content and one word page structure
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request
          UA={'User-Agent':'WoW-Reader-dictionary-builder/1.0 (+https://github.com/whispermmepub/wow-reader-lab)'}
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=60) as r:return r.read().decode('utf-8','replace')
          urls=[
          'https://kaikki.org/dictionary/English/categories-other/my/Terms%20with%20Burmese%20translations/ASEAN--Atthadassi.html',
          'https://kaikki.org/dictionary/English/meaning/A/Ar/Arabic.html']
          pat=re.compile(r'[\u1000-\u109f\ua9e0-\ua9ff\uaa60-\uaa7f]')
          for url in urls:
              txt=get(url); hits=[m.start() for m in pat.finditer(txt)]
              print('\nURL',url,'bytes',len(txt),'Myanmar chars',len(hits))
              for pos in hits[:20]: print(txt[max(0,pos-500):pos+1000].replace('\n',' ')[:1600])
              for needle in ['translations','Burmese','lang_code','translation']:
                  print('needle',needle,'count',txt.lower().count(needle.lower()))
                  p=txt.lower().find(needle.lower())
                  if p>=0: print(txt[max(0,p-1000):p+3000])
          PY
