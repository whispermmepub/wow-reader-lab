name: Build signed WoW Reader Lab v2.17.2 test release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/SIGNED_V42_TRIGGER.txt'

permissions:
  contents: read

jobs:
  signed-lab-release:
    runs-on: ubuntu-latest
    env:
      WOW_RELEASE_STORE_PASSWORD: ${{ secrets.WOW_RELEASE_STORE_PASSWORD }}
      WOW_RELEASE_KEY_ALIAS: ${{ secrets.WOW_RELEASE_KEY_ALIAS }}
      WOW_RELEASE_KEY_PASSWORD: ${{ secrets.WOW_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Verify Lab version and feature guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "versionCode 42" app/build.gradle
          grep -q "versionName '2.17.2'" app/build.gradle
          grep -q "myanmar-calendar:1.1.1.RELEASE" app/build.gradle
          test -s app/src/main/java/com/whisper/wowreader/ReadingCalendarActivity.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingDayActivity.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingMemoryActivity.java
          grep -q "renameShelf" app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          grep -q "deleteShelf" app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          test ! -e app/src/main/java/com/whisper/wowreader/AutoLibrarySync.java
          test ! -d cloudflare/telegram-auto-library

      - name: Prepare protected signing key
        env:
          WOW_RELEASE_KEYSTORE_BASE64: ${{ secrets.WOW_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WOW_RELEASE_KEYSTORE_BASE64"
          test -n "$WOW_RELEASE_STORE_PASSWORD"
          test -n "$WOW_RELEASE_KEY_ALIAS"
          test -n "$WOW_RELEASE_KEY_PASSWORD"
          WOW_RELEASE_STORE_FILE="$RUNNER_TEMP/wow-reader-production.jks"
          printf '%s' "$WOW_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$WOW_RELEASE_STORE_FILE"
          chmod 600 "$WOW_RELEASE_STORE_FILE"
          echo "WOW_RELEASE_STORE_FILE=$WOW_RELEASE_STORE_FILE" >> "$GITHUB_ENV"

      - name: Build, lint and sign
        run: gradle :app:clean :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace

      - name: Verify signed Lab artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='42'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.2'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -certs "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -qi '21:17:d3:1e:01:eb:24:ea:e3:fe:4a:26:88:c8:c7:12:cd:76:71:f1'
          "$APKSIGNER" verify --print-certs "$APK" | grep -qi '21:17:d3:1e:01:eb:24:ea:e3:fe:4a:26:88:c8:c7:12:cd:76:71:f1'

      - name: Collect signed Lab release
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk WoW-Reader-Lab-v2.17.2-v42-signed.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-Lab-v2.17.2-v42-signed.aab

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v2.17.2-v42-signed
          path: |
            WoW-Reader-Lab-v2.17.2-v42-signed.apk
            WoW-Reader-Lab-v2.17.2-v42-signed.aab
          if-no-files-found: error
          retention-days: 14
