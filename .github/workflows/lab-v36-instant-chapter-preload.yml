name: WoW Reader Lab v36 Instant Chapter Preload

on:
  push:
    branches:
      - feature/lab-v36-instant-chapter-preload

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply v36 instant preload patch
        run: python3 scripts/apply_lab_v36_instant_preload.py

      - name: Verify instant preload source contract
        shell: bash
        run: |
          set -euo pipefail
          R=app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          G=app/build.gradle
          grep -q 'private ReaderWebView preloadWebView' "$R"
          grep -q 'scheduleAdjacentChapterPreload(preferredPreloadDirection)' "$R"
          grep -q 'activatePreloadedChapterIfReady' "$R"
          grep -q 'handlePreloadPageFinished' "$R"
          grep -q 'warmPreloadedChapter' "$R"
          grep -q 'owner != webView' "$R"
          grep -q 'android.view.PixelCopy.request(getWindow(), src, shot' "$R"
          grep -q 'versionCode 36' "$G"
          grep -q "versionName '2.16.6-lab-v36'" "$G"
          python3 - <<'PY'
          from pathlib import Path
          t=Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java').read_text()
          assert t.count('private ReaderWebView preloadWebView') == 1
          assert 'preloadWebView.loadUrl(Uri.fromFile(spine.get(target)).toString())' in t
          assert 'webView = incoming;' in t and 'preloadWebView = outgoing;' in t
          assert 'if (view != webView) {' in t
          assert 'preloadWebView.setAlpha(0.01f)' in t
          assert 'cancelChapterPreload();\n                loadCurrentEpubChapter();' in t
          assert 'PixelCopy.request' in t
          print('v36 preload source contract PASS')
          PY
          git diff --check

      - name: Commit clean v36 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git rm scripts/apply_lab_v36_instant_preload.py
          git rm .github/workflows/lab-v36-instant-chapter-preload.yml
          git add app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/build.gradle
          git commit -m 'Preload adjacent EPUB chapters for instant transitions in v36'
          git push origin HEAD:feature/lab-v36-instant-chapter-preload

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true

      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Compile debug release and lint
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease --stacktrace

      - name: Smoke check release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.whisper.wowreader' versionCode='36' versionName='2.16.6-lab-v36'" /tmp/badging.txt

      - name: Collect unsigned APK and signing tools
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/WoW-Reader-Lab-v36-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" out/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/zipalign

      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v36-unsigned
          path: out/
          retention-days: 2
