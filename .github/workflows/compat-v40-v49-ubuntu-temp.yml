name: Verify v40 update and fresh install for v49

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compat-v40-v49-ubuntu-temp.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36"
      - name: Build v49 and v40 debug with same signer
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/wow-v49.apk
          git clone --quiet https://github.com/whispermmepub/wow-reader-app.git /tmp/wow-old
          cd /tmp/wow-old
          git checkout --quiet afc75339dece9ff175f8d498a9744fc88bbb6a62
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/wow-v40.apk
          test -s /tmp/wow-v49.apk
          test -s /tmp/wow-v40.apk
      - name: Exercise v40 update and fresh install
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            PKG=com.whisper.wowreader
            OLD=/tmp/wow-v40.apk
            NEW=/tmp/wow-v49.apk

            echo '=== v40 -> v49 update ==='
            adb install "$OLD"
            adb shell run-as "$PKG" mkdir -p files/library shared_prefs
            printf 'v40-library-preserved\n' | adb shell "run-as $PKG sh -c 'cat > files/library/__v40_update_sentinel.txt'"
            cat > /tmp/wow_reader.xml <<'XML'
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map>
                <int name="percent_update-test.epub" value="37" />
                <string name="library_shelves_json">{&quot;Favorites&quot;:[&quot;update-test.epub&quot;]}</string>
                <string name="reading_stats_day_notes_json">{&quot;2026-09-05&quot;:&quot;v40 update sentinel&quot;}</string>
            </map>
            XML
            cat /tmp/wow_reader.xml | adb shell "run-as $PKG sh -c 'cat > shared_prefs/wow_reader.xml'"
            adb install -r "$NEW"
            adb logcat -c
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 5
            adb shell dumpsys package "$PKG" | grep -q 'versionCode=49'
            adb shell run-as "$PKG" test -f files/library/__v40_update_sentinel.txt
            adb shell run-as "$PKG" grep -q 'value="37"' shared_prefs/wow_reader.xml
            adb shell run-as "$PKG" grep -q 'library_shelves_json' shared_prefs/wow_reader.xml
            adb shell run-as "$PKG" grep -q 'reading_stats_day_notes_json' shared_prefs/wow_reader.xml
            adb shell pidof "$PKG" >/dev/null
            if adb logcat -d | grep -A8 -B2 'FATAL EXCEPTION' | grep -q "$PKG"; then exit 1; fi

            echo '=== clean -> v49 ==='
            adb uninstall "$PKG"
            adb install "$NEW"
            adb logcat -c
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 5
            adb shell dumpsys package "$PKG" | grep -q 'versionCode=49'
            adb shell run-as "$PKG" test -d files/library
            adb shell run-as "$PKG" test -d files/cover_cache
            if adb shell run-as "$PKG" test -f files/library/__v40_update_sentinel.txt; then exit 1; fi
            adb shell pidof "$PKG" >/dev/null
            if adb logcat -d | grep -A8 -B2 'FATAL EXCEPTION' | grep -q "$PKG"; then exit 1; fi

            cat > compatibility-report.txt <<'REPORT'
            WoW Reader v2.17.9 / versionCode 49
            Package: com.whisper.wowreader
            v2.17.0/v40 -> v49 in-place update: PASS
            Existing library sentinel: PASS
            Existing reading progress/shelf/calendar prefs: PASS
            Clean v49 fresh install: PASS
            New library/cache initialization: PASS
            Launch fatal-exception check: PASS
            REPORT
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v49-update-fresh-compatibility
          path: compatibility-report.txt
          if-no-files-found: error
          retention-days: 14
