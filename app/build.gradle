plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def releaseStoreFile = System.getenv('WOW_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('WOW_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('WOW_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('WOW_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.whisper.wowreader'
    compileSdk 36

    defaultConfig {
        applicationId 'com.whisper.wowreader'
        minSdk 23
        targetSdk 36
        versionCode 48
        versionName '2.17.8'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.github.chanmratekoko:myanmar-calendar:1.1.1.RELEASE'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
}
