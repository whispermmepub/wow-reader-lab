name: Patch v47 native footnote link guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-footnote-native-link-guard-v47b-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Patch native anchor hit guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java')
          s = p.read_text()
          old = (
              '    private void handleReaderTap(float x, float y) {\n'
              '        if (android.os.SystemClock.uptimeMillis() < footnoteTapSuppressUntilMs) return;\n'
              '        if (webView == null || chapterLoading || tapHitTestPending) return;\n'
              '\n'
              '        final float ratio = x / Math.max(1f, webView.getWidth());\n'
          )
          new = (
              '    private void handleReaderTap(float x, float y) {\n'
              '        if (android.os.SystemClock.uptimeMillis() < footnoteTapSuppressUntilMs) return;\n'
              '        if (webView == null || chapterLoading || tapHitTestPending) return;\n'
              '        // Use WebView native hit testing before the async DOM hit test. This is density-safe\n'
              '        // and prevents a real anchor/footnote tap from also being treated as an edge page turn.\n'
              '        try {\n'
              '            android.webkit.WebView.HitTestResult nativeHit = webView.getHitTestResult();\n'
              '            if (nativeHit != null) {\n'
              '                int hitType = nativeHit.getType();\n'
              '                if (hitType == android.webkit.WebView.HitTestResult.SRC_ANCHOR_TYPE ||\n'
              '                        hitType == android.webkit.WebView.HitTestResult.SRC_IMAGE_ANCHOR_TYPE) return;\n'
              '            }\n'
              '        } catch (Exception ignored) {}\n'
              '\n'
              '        final float ratio = x / Math.max(1f, webView.getWidth());\n'
          )
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'handleReaderTap target count={n}')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'SRC_ANCHOR_TYPE' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'footnoteTapSuppressUntilMs' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          ! grep -q 'Show on page' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "versionCode 47" app/build.gradle
          grep -q "versionName '2.17.7'" app/build.gradle
          git diff --check

      - name: Build and lint
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:lintRelease --stacktrace
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='47'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.7'"

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git commit -m 'Guard footnote anchors from edge page turns'
          git push origin HEAD:main
