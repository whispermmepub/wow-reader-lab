name: Verify v52 reader and installation
on:
  push:
    branches: [fix/v52-unified-install]
    paths: ['app/**', 'tools/verify-v52.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            arch: x86
          - api: 29
            arch: x86_64
          - api: 35
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          disable-animations: true
          script: bash tools/verify-v52.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v52-regression-api${{ matrix.api }}
          path: verification/
