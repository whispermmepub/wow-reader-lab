name: Cleanup old Actions artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-storage-temp.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old repository artifacts, keep latest v60 artifact
        uses: actions/github-script@v7
        with:
          script: |
            const keep = new Set([10045416412]);
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            let deleted = 0;
            let bytes = 0;
            for (const artifact of artifacts) {
              if (artifact.expired || keep.has(artifact.id)) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              deleted += 1;
              bytes += artifact.size_in_bytes || 0;
              core.info(`Deleted ${artifact.id} ${artifact.name} (${artifact.size_in_bytes || 0} bytes)`);
            }
            core.info(`Cleanup complete: deleted ${deleted} artifacts, freed about ${bytes} bytes.`);
