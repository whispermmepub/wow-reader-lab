name: Patch WoW Reader v2.18.0 v50

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v50-search-autoscroll-eyecare-temp.yml'
      - '.github/scripts/patch_v50.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Apply source patch
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_v50.py
          git diff --check
          grep -q "versionCode 50" app/build.gradle
          grep -q "versionName '2.18.0'" app/build.gradle
          grep -q "Home search submit is consumed" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "reader_auto_scroll_enabled" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "onAutoScrollEnd" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "EYE_BREAK_INTERVAL_MS" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
      - name: Build and lint
        run: gradle :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace
      - name: Smoke checks
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='50'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.0'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
      - name: Commit verified source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/com/whisper/wowreader/MainActivity.java app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git commit -m 'Add Home search fix, auto scroll and eye care in v2.18.0 v50'
          git push origin HEAD:main
      - name: Collect artifacts
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-Lab-v2.18.0-v50-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-Lab-v2.18.0-v50-unsigned.aab
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v2.18.0-v50-patch-build
          path: |
            WoW-Reader-Lab-v2.18.0-v50-unsigned.apk
            WoW-Reader-Lab-v2.18.0-v50-unsigned.aab
          if-no-files-found: error
          retention-days: 14
