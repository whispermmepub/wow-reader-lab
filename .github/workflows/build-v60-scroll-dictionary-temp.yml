name: Build v60 whole-book scroll and dictionary fixes

on:
  push:
    branches: ['feature/v60-scroll-dictionary']
    paths:
      - '.github/workflows/build-v60-scroll-dictionary-temp.yml'
      - 'scripts/v60_patch.py'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v60:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v60-scroll-dictionary
          fetch-depth: 0

      - name: Apply v60 changes
        run: python3 scripts/v60_patch.py

      - name: Source smoke checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 60" app/build.gradle
          grep -q "versionName '2.19.0'" app/build.gradle
          grep -q "reader_auto_scroll_whole_book" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "Whole book" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "normalizeLegacyMyanmarOrder" app/src/main/java/com/whisper/wowreader/KindleDictionaryStore.java
          grep -q "application/x-mobi" app/src/main/java/com/whisper/wowreader/DictionaryManagerActivity.java
          grep -q "application/mobi" app/src/main/java/com/whisper/wowreader/DictionaryManagerActivity.java
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Unit tests and build
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Lint release
        run: gradle :app:lintRelease --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='60'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.19.0'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"

      - name: Commit verified v60 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/src/main/java/com/whisper/wowreader/KindleDictionaryStore.java app/src/main/java/com/whisper/wowreader/DictionaryManagerActivity.java
          if ! git diff --cached --quiet; then
            git commit -m "Add v60 whole-book auto scroll and Kindle dictionary fixes [skip ci]"
            git push origin HEAD:feature/v60-scroll-dictionary
          fi

      - name: Collect APKs
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v2.19.0-v60-unsigned.apk
          cp app/build/outputs/apk/debug/app-debug.apk WoW-Reader-v2.19.0-v60-debug.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.19.0-v60-scroll-dictionary-test
          path: |
            WoW-Reader-v2.19.0-v60-unsigned.apk
            WoW-Reader-v2.19.0-v60-debug.apk
          if-no-files-found: error
          retention-days: 14
