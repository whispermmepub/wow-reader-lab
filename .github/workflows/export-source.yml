name: Export source snapshot

on:
  push:
    branches:
      - fix/v63-stability-scalable-library
    paths:
      - '.github/workflows/export-source.yml'
      - 'export-source-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_COMMIT.txt
          zip -qr wow-reader-source.zip . -x '.git/*' 'wow-reader-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: wow-reader-v63-source
          path: wow-reader-source.zip
          retention-days: 1
