name: Build WoW Reader v54 OEM PDF candidate

on:
  push:
    branches: [fix/v54-reader-pdf-oem]
    paths:
      - 'app/**'
      - '.github/workflows/build-v54-reader-pdf-oem-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: v54 source guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 54" app/build.gradle
          grep -q "versionName '2.18.4'" app/build.gradle
          test -s app/src/main/java/com/whisper/wowreader/PdfContinuousView.java
          test -s app/src/main/java/com/whisper/wowreader/BookImportTypeDetector.java
          grep -q "BookImportTypeDetector.resolveExtension" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "saveReaderLocationDurable" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "pdf_reading_mode" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "PdfContinuousView" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "1 is extra slow" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "ReadingProgressStore.set" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "getBindingAdapterPosition" app/src/main/java/com/whisper/wowreader/PdfContinuousView.java
          git diff --check
      - name: Compile release debug and instrumentation
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Android lint
        run: gradle :app:lintRelease --stacktrace
      - name: APK smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='54'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.4'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
      - name: Collect build
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v2.18.4-v54-unsigned.apk
          cp app/build/outputs/apk/debug/app-debug.apk WoW-Reader-v2.18.4-v54-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk WoW-Reader-v2.18.4-v54-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.18.4-v54-build
          path: |
            WoW-Reader-v2.18.4-v54-unsigned.apk
            WoW-Reader-v2.18.4-v54-debug.apk
            WoW-Reader-v2.18.4-v54-androidTest.apk
          if-no-files-found: error
          retention-days: 14
