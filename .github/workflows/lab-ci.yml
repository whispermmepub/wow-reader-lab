name: WoW Reader Lab CI

on:
  push:
    branches: ['feature/**']
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Lab regression source checks
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/whisper/wowreader/ReadingStatsStore.java
          grep -q 'ReadingStatsStore.beginSession' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'ReadingStatsStore.finishSession' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'showReadingStatsDialog' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'GoogleAuthProvider.getCredential' app/src/main/java/com/whisper/wowreader/GoogleAccountAuth.java
          grep -q 'Scopes.DRIVE_APPFOLDER' app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          grep -q 'ReaderAnnotationStore.add' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'prewarmAdjacentChapters' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git diff --check
      - name: Compile and lint lab app
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
