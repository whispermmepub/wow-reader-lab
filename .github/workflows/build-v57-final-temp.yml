name: Finalize v57 reader dictionary and library views

on:
  push:
    branches: [feature/v57-dictionary-reader-polish]
    paths:
      - '.github/workflows/build-v57-final-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v57-dictionary-reader-polish
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true

      - name: Apply v57 changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/finalize_v57.py
          python3 .github/scripts/v57_api23_fix.py

      - name: Source smoke checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 57" app/build.gradle
          grep -q "versionName '2.18.7'" app/build.gradle
          grep -q 'Notes & Highlight' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'Large Grid' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'Small Grid' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'library_small_grid' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'ScaleGestureDetector' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'Font weight' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'DictionaryManagerActivity' app/src/main/AndroidManifest.xml
          grep -q 'Wiktionary Online' app/src/main/java/com/whisper/wowreader/DictionaryDialog.java
          test -s app/src/main/assets/dictionary/myanmar_spelling.txt
          test $(wc -c < app/src/main/assets/dictionary/myanmar_spelling.txt) -gt 500000
          python3 -c "import sqlite3; c=sqlite3.connect('app/src/main/assets/dictionary/wow_dictionary.db'); d=dict(c.execute('select direction,count(*) from entries group by direction').fetchall()); assert d.get(0,0)>1000 and d.get(1,0)>1000,d; assert c.execute(\"select count(*) from entries where direction=0 and headword_norm='book'\").fetchone()[0]>0; assert c.execute(\"select count(*) from entries where direction=1 and headword_norm='စာအုပ်'\").fetchone()[0]>0; print('dictionary smoke ok',d)"

      - name: Build test APK and run tests and lint
        run: gradle :app:clean :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:lintRelease --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='57'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.7'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          unzip -l "$APK" | grep -q 'assets/dictionary/myanmar_spelling.txt'
          cp "$APK" WoW-Reader-v2.18.7-v57-test-debug.apk
          sha256sum WoW-Reader-v2.18.7-v57-test-debug.apk > WoW-Reader-v2.18.7-v57-test-debug.sha256.txt

      - name: Commit verified v57 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/whisper/wowreader/MainActivity.java app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/src/main/java/com/whisper/wowreader/DictionaryDialog.java app/src/main/java/com/whisper/wowreader/DictionaryManagerActivity.java app/src/main/java/com/whisper/wowreader/KindleDictionaryStore.java app/src/main/java/com/whisper/wowreader/MyanmarSpellingStore.java app/src/main/assets/dictionary/myanmar_spelling.txt app/src/main/assets/dictionary/SPELLING-NOTICE.txt
          git rm -f .github/scripts/finalize_v57.py .github/scripts/v57_api23_fix.py .github/workflows/build-v57-dictionary-reader-temp.yml .github/workflows/build-v57-final-temp.yml
          git commit -m 'Finalize v57 dictionary reader and library views'
          git push origin HEAD:feature/v57-dictionary-reader-polish

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.18.7-v57-test-debug
          path: |
            WoW-Reader-v2.18.7-v57-test-debug.apk
            WoW-Reader-v2.18.7-v57-test-debug.sha256.txt
          if-no-files-found: error
          retention-days: 30
