name: Build v59 typography and E-Ink test

on:
  push:
    branches:
      - feature/v59-typography-eink
    paths:
      - .github/workflows/build-v59-typography-eink-temp.yml
      - scripts/v59_typography_eink_patch.py
      - app/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v59:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v59-typography-eink
          fetch-depth: 0

      - name: Apply v59 changes
        run: python3 scripts/v59_typography_eink_patch.py

      - name: Source smoke checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 59" app/build.gradle
          grep -q "versionName '2.18.9'" app/build.gradle
          grep -q "E-Ink Color" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "readerTheme == 4" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "wow-rhythm-indent" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "wow-latin-smart" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "overflow-wrap:break-word" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "AppThemePalette.custom(prefs)" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "theme == 3" app/src/main/java/com/whisper/wowreader/ReadingRulerView.java
          grep -q "palette(theme, prefs)" app/src/main/java/com/whisper/wowreader/DictionaryDialog.java
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Unit tests and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Lint release
        run: gradle :app:lintRelease --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='59'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.9'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"

      - name: Commit verified v59 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/src/main/java/com/whisper/wowreader/DictionaryDialog.java app/src/main/java/com/whisper/wowreader/ReadingRulerView.java
          if ! git diff --cached --quiet; then
            git commit -m "Add v59 typography rhythm and E-Ink reader themes [skip ci]"
            git push origin HEAD:feature/v59-typography-eink
          fi

      - name: Collect APKs
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v2.18.9-v59-unsigned-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk WoW-Reader-v2.18.9-v59-debug.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.18.9-v59-typography-eink-test
          path: |
            WoW-Reader-v2.18.9-v59-unsigned-release.apk
            WoW-Reader-v2.18.9-v59-debug.apk
          if-no-files-found: error
          retention-days: 14
