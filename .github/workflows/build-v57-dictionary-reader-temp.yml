name: Build v57 dictionary and reader polish

on:
  push:
    branches: [feature/v57-dictionary-reader-polish]
    paths:
      - '.github/workflows/build-v57-dictionary-reader-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v57-dictionary-reader-polish
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true

      - name: Integrate v57 reader and dictionary changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, base64, urllib.request

          def rep(s, old, new, label, count=1):
              if old not in s:
                  raise SystemExit('missing marker: '+label)
              return s.replace(old, new, count)

          # Bundle the permissively licensed Myanmar spelling word list pinned by blob SHA.
          asset = Path('app/src/main/assets/dictionary/myanmar_spelling.txt')
          asset.parent.mkdir(parents=True, exist_ok=True)
          req = urllib.request.Request(
              'https://api.github.com/repos/kanaung/wordlists/git/blobs/1cb25065823a1d931fc13a637fae6d44acc44f3f',
              headers={'User-Agent':'WoW-Reader-build'})
          with urllib.request.urlopen(req, timeout=45) as r:
              payload = json.load(r)
          raw = base64.b64decode(payload['content'])
          if len(raw) < 500000:
              raise SystemExit('Myanmar spelling asset unexpectedly small')
          asset.write_bytes(raw)
          Path('app/src/main/assets/dictionary/SPELLING-NOTICE.txt').write_text(
              'Myanmar spelling word list from kanaung/wordlists, pinned blob 1cb25065823a1d931fc13a637fae6d44acc44f3f.\n'
              'Repository license: WTFPL. This list is used only as an offline spelling word list.\n', encoding='utf-8')

          # v57 version.
          p=Path('app/build.gradle'); s=p.read_text(encoding='utf-8')
          s=rep(s,'versionCode 56','versionCode 57','version code')
          s=rep(s,"versionName '2.18.6'","versionName '2.18.7'",'version name')
          p.write_text(s,encoding='utf-8')

          # Home wording.
          p=Path('app/src/main/java/com/whisper/wowreader/MainActivity.java'); s=p.read_text(encoding='utf-8')
          s=rep(s,'bottomNavItem("✎", "Notes", false, this::showNotesHighlightsHub)',
                'bottomNavItem("✎", "Notes & Highlight", false, this::showNotesHighlightsHub)','notes nav label')
          p.write_text(s,encoding='utf-8')

          # Manifest source manager.
          p=Path('app/src/main/AndroidManifest.xml'); s=p.read_text(encoding='utf-8')
          marker='''        <activity\n            android:name=".BookReaderActivity"'''
          insert='''        <activity\n            android:name=".DictionaryManagerActivity"\n            android:exported="false" />\n\n        <activity\n            android:name=".BookReaderActivity"'''
          s=rep(s,marker,insert,'dictionary manager manifest')
          p.write_text(s,encoding='utf-8')

          # Fix DictionaryManager standalone card backgrounds.
          p=Path('app/src/main/java/com/whisper/wowreader/DictionaryManagerActivity.java'); s=p.read_text(encoding='utf-8')
          s=rep(s,'import android.graphics.Typeface;\n','import android.graphics.Typeface;\nimport android.graphics.drawable.GradientDrawable;\n','manager gradient import')
          s=s.replace('AppThemePalette.roundRect(', 'roundRect(')
          marker='''    private TextView button(String text) {'''
          helper='''    private GradientDrawable roundRect(int fill, int radius, int strokeWidth, int strokeColor) {\n        GradientDrawable g = new GradientDrawable();\n        g.setColor(fill);\n        g.setCornerRadius(radius);\n        if (strokeWidth > 0) g.setStroke(strokeWidth, strokeColor);\n        return g;\n    }\n\n'''+marker
          s=rep(s,marker,helper,'manager roundRect helper')
          p.write_text(s,encoding='utf-8')

          # Make PalmDOC decompression bounded and fast.
          p=Path('app/src/main/java/com/whisper/wowreader/KindleDictionaryStore.java'); s=p.read_text(encoding='utf-8')
          s=s.replace('import java.io.ByteArrayOutputStream;\n','')
          old=re.search(r'(?ms)^    private static byte\[\] palmDocDecompress\(byte\[\] data\) throws Exception \{.*?^    \}\n\n    private static int indexOfIgnoreCase',s)
          if not old: raise SystemExit('missing PalmDOC decompressor')
          new='''    private static byte[] palmDocDecompress(byte[] data) throws Exception {\n        ByteBuf out = new ByteBuf(Math.max(4096, data.length * 3));\n        int i = 0;\n        while (i < data.length) {\n            int c = data[i++] & 0xFF;\n            if (c == 0 || (c >= 9 && c <= 0x7F)) {\n                out.write(c);\n            } else if (c >= 1 && c <= 8) {\n                int n = Math.min(c, data.length - i);\n                out.write(data, i, n); i += n;\n            } else if (c >= 0xC0) {\n                out.write(0x20); out.write(c ^ 0x80);\n            } else {\n                if (i >= data.length) break;\n                int c2 = data[i++] & 0xFF;\n                int v = (c << 8) | c2;\n                int distance = (v >> 3) & 0x7FF;\n                int length = (v & 7) + 3;\n                if (distance <= 0 || distance > out.size()) throw new Exception("Invalid PalmDOC back-reference");\n                for (int j = 0; j < length; j++) out.copyBack(distance);\n            }\n        }\n        return out.toByteArray();\n    }\n\n    private static final class ByteBuf {\n        private byte[] data; private int size;\n        ByteBuf(int capacity) { data = new byte[Math.max(32, capacity)]; }\n        int size() { return size; }\n        void write(int value) { ensure(1); data[size++] = (byte) value; }\n        void write(byte[] src, int off, int len) { ensure(len); System.arraycopy(src, off, data, size, len); size += len; }\n        void copyBack(int distance) { ensure(1); data[size] = data[size - distance]; size++; }\n        byte[] toByteArray() { return java.util.Arrays.copyOf(data, size); }\n        private void ensure(int extra) {\n            int need = size + extra;\n            if (need <= data.length) return;\n            int cap = Math.max(need, data.length + Math.max(1024, data.length / 2));\n            data = java.util.Arrays.copyOf(data, cap);\n        }\n    }\n\n    private static int indexOfIgnoreCase'''
          s=s[:old.start()]+new+s[old.end():]
          p.write_text(s,encoding='utf-8')

          # Dictionary: fresh bundled DB, imported Kindle source, spelling status and in-app Wiktionary.
          p=Path('app/src/main/java/com/whisper/wowreader/DictionaryDialog.java'); s=p.read_text(encoding='utf-8')
          s=rep(s,'import android.content.Context;\n','import android.content.Context;\nimport android.content.Intent;\n','dictionary intent import')
          s=rep(s,'private static final String DB_FILE = "wow_dictionary_v1.db";',
                'private static final String DB_FILE = "wow_dictionary_v2.db";','dictionary db version')
          marker='''        List<Entry> entries = lookup(activity, query, direction);\n'''
          insert=marker+'''        if (!myanmar) {\n            List<KindleDictionaryStore.Result> imported = KindleDictionaryStore.lookup(activity, query, 6);\n            for (int i = imported.size() - 1; i >= 0; i--) {\n                KindleDictionaryStore.Result r = imported.get(i);\n                entries.add(0, new Entry(r.headword, "Kindle Dictionary · Offline", r.meaning, "", ""));\n            }\n        }\n        MyanmarSpellingStore.Match spelling = myanmar ? MyanmarSpellingStore.lookup(activity, query) : null;\n'''
          s=rep(s,marker,insert,'dictionary imported source')
          marker='''        if (entries.isEmpty()) {\n'''
          spelling='''        if (spelling != null) {\n            LinearLayout spellCard = new LinearLayout(activity);\n            spellCard.setOrientation(LinearLayout.VERTICAL);\n            spellCard.setPadding(dp(activity, 13), dp(activity, 11), dp(activity, 13), dp(activity, 11));\n            GradientDrawable spellBg = new GradientDrawable();\n            spellBg.setColor(p.card); spellBg.setCornerRadius(dp(activity, 14)); spellBg.setStroke(dp(activity, 1), p.border);\n            spellCard.setBackground(spellBg);\n            TextView sh = text(activity, "မြန်မာစာလုံးပေါင်း သတ်ပုံကျမ်း", 14.5f, p.text, Typeface.BOLD);\n            spellCard.addView(sh);\n            String message = spelling.found ? "✓ စာလုံးပေါင်းစာရင်းတွင် တွေ့ရှိသည်" : "စာလုံးပေါင်းစာရင်းတွင် မတွေ့ပါ";\n            if (!spelling.suggestions.isEmpty())\n                message += "\\nအနီးစပ်ဆုံး: " + android.text.TextUtils.join(" · ", spelling.suggestions);\n            TextView sm = text(activity, message, 13.5f, spelling.found ? p.accent : p.subText, Typeface.NORMAL);\n            sm.setPadding(0, dp(activity, 5), 0, 0); spellCard.addView(sm);\n            LinearLayout.LayoutParams slp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);\n            slp.bottomMargin = dp(activity, 8); results.addView(spellCard, slp);\n        }\n\n'''+marker
          s=rep(s,marker,spelling,'spelling card')
          s=rep(s,'TextView onlineTab = pill(activity, "Online", p.text, p.surface, p.border, false);',
                'TextView onlineTab = pill(activity, "Wiktionary", p.text, p.surface, p.border, false);','wiktionary tab')
          s=rep(s,'source.setText(directionLabel + "  •  Online");',
                'source.setText(directionLabel + "  •  Wiktionary Online");','online source label')
          s=rep(s,'online.loadUrl("https://kaikki.org/dictionary/?q=" + Uri.encode(query));',
                'online.loadUrl((myanmar ? "https://my.wiktionary.org/wiki/" : "https://en.wiktionary.org/wiki/") + Uri.encode(query));','online wiktionary url')
          s=rep(s,'"Dictionary data: Wiktionary via Kaikki.org • CC BY-SA 4.0",',
                '"Offline data: Wiktionary via Kaikki.org • Myanmar spelling list • imported Kindle dictionary when installed",','dictionary attribution')
          marker='''        TextView copy = pill(activity, "Copy", p.text, p.card, p.border, false);\n'''
          sources='''        TextView sources = pill(activity, "Sources", p.accent, p.card, p.border, false);\n        sources.setOnClickListener(v -> {\n            dialog.dismiss();\n            activity.startActivity(new Intent(activity, DictionaryManagerActivity.class));\n        });\n        LinearLayout.LayoutParams sourceLp = new LinearLayout.LayoutParams(0, dp(activity, 38), 1f);\n        sourceLp.rightMargin = dp(activity, 7);\n        footer.addView(sources, sourceLp);\n\n'''+marker
          s=rep(s,marker,sources,'dictionary sources button')
          s=rep(s,'if (target.exists() && target.length() > 1000000L) return target;',
                'if (target.exists() && target.length() > 1000000L && validBundledDb(target)) return target;','bundled db validation')
          marker='''    private static String cleanQuery(String text) {\n'''
          valid='''    private static boolean validBundledDb(File target) {\n        SQLiteDatabase db = null; Cursor c = null;\n        try {\n            db = SQLiteDatabase.openDatabase(target.getAbsolutePath(), null, SQLiteDatabase.OPEN_READONLY);\n            c = db.rawQuery("SELECT direction,count(*) FROM entries GROUP BY direction", null);\n            boolean en = false, my = false;\n            while (c.moveToNext()) {\n                int d = c.getInt(0), n = c.getInt(1);\n                if (d == 0 && n > 1000) en = true;\n                if (d == 1 && n > 1000) my = true;\n            }\n            return en && my;\n        } catch (Exception ignored) { return false; }\n        finally {\n            if (c != null) try { c.close(); } catch (Exception ignored) {}\n            if (db != null) try { db.close(); } catch (Exception ignored) {}\n        }\n    }\n\n'''+marker
          s=rep(s,marker,valid,'bundled db validator')
          p.write_text(s,encoding='utf-8')

          # Reader: Kindle-style pinch font size, font weight control and persistent advanced settings.
          p=Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java'); s=p.read_text(encoding='utf-8')
          s=rep(s,'    private int fontPercent = 115;\n','    private int fontPercent = 115;\n    private int fontWeight = 400;\n','font weight field')
          s=rep(s,'    private View.OnTouchListener readerTouchListener;\n',
                '''    private View.OnTouchListener readerTouchListener;\n    private ScaleGestureDetector epubFontScaleDetector;\n    private boolean epubFontPinching = false;\n    private float pinchFontValue = 115f;\n    private long fontPinchSuppressUntilMs = 0L;\n    private AlertDialog advancedReaderDialog;\n    private android.widget.ArrayAdapter<String> advancedReaderAdapter;\n''','pinch fields')
          s=rep(s,'        fontPercent = Math.max(80, Math.min(300, prefs.getInt("epub_font", 115)));\n',
                '        fontPercent = Math.max(80, Math.min(300, prefs.getInt("epub_font", 115)));\n        fontWeight = normalizeFontWeight(prefs.getInt("epub_font_weight", 400));\n','load font weight')
          # Existing WebView clamps prevented >200% font sizes. Make the stored 300% range real.
          s=s.replace('Math.min(200, fontPercent)', 'Math.min(300, fontPercent)')

          marker='''        pageTouchSlop = ViewConfiguration.get(this).getScaledTouchSlop();\n\n        readerTapDetector = new GestureDetector'''
          pinch='''        pageTouchSlop = ViewConfiguration.get(this).getScaledTouchSlop();\n\n        epubFontScaleDetector = new ScaleGestureDetector(this, new ScaleGestureDetector.SimpleOnScaleGestureListener() {\n            @Override public boolean onScaleBegin(ScaleGestureDetector detector) {\n                if (chapterLoading || isPdf) return false;\n                epubFontPinching = true;\n                pinchFontValue = fontPercent;\n                beginAutoScrollInteraction();\n                return true;\n            }\n            @Override public boolean onScale(ScaleGestureDetector detector) {\n                if (!epubFontPinching) return false;\n                pinchFontValue *= detector.getScaleFactor();\n                pinchFontValue = Math.max(80f, Math.min(300f, pinchFontValue));\n                int target = Math.max(80, Math.min(300, Math.round(pinchFontValue / 2f) * 2));\n                if (target != fontPercent) {\n                    fontPercent = target;\n                    try { if (webView != null) webView.getSettings().setTextZoom(fontPercent); } catch (Exception ignored) {}\n                    try { if (preloadWebView != null) preloadWebView.getSettings().setTextZoom(fontPercent); } catch (Exception ignored) {}\n                    if (positionView != null) positionView.setText("Aa · " + fontPercent + "%");\n                }\n                return true;\n            }\n            @Override public void onScaleEnd(ScaleGestureDetector detector) {\n                if (!epubFontPinching) return;\n                epubFontPinching = false;\n                fontPinchSuppressUntilMs = android.os.SystemClock.uptimeMillis() + 360L;\n                saveReaderPreferences();\n                applyReaderStyleSmooth(true);\n                if (root != null) root.postDelayed(BookReaderActivity.this::endAutoScrollInteraction, 520L);\n                else endAutoScrollInteraction();\n            }\n        });\n\n        readerTapDetector = new GestureDetector'''
          s=rep(s,marker,pinch,'pinch detector')

          marker='''        readerTouchListener = (v, event) -> {\n            // A WebView link tap must never also become a reader page/edge tap.\n'''
          touch='''        readerTouchListener = (v, event) -> {\n            if (epubFontScaleDetector != null) {\n                try { epubFontScaleDetector.onTouchEvent(event); } catch (Exception ignored) {}\n                if (epubFontPinching || event.getPointerCount() > 1 ||\n                        android.os.SystemClock.uptimeMillis() < fontPinchSuppressUntilMs) {\n                    readerTouchStartedOnLink = false;\n                    return true;\n                }\n            }\n            // A WebView link tap must never also become a reader page/edge tap.\n'''
          s=rep(s,marker,touch,'pinch touch handling')

          # Font weight is inherited, preserving explicit strong/bold markup in the EPUB.
          s=rep(s,'                "a{color:" + link + " !important;}" +\n',
                '                "a{color:" + link + " !important;}" +\n                "body{font-weight:" + fontWeight + " !important;}" +\n','font weight css')

          # Add a weight slider to the main display sheet.
          marker='''        card.addView(fontSizeRow);\n\n        addSheetLabel(card, "Line height", sub);'''
          weight='''        card.addView(fontSizeRow);\n\n        addSheetLabel(card, "Font weight", sub);\n        LinearLayout weightRow = sheetRow();\n        SeekBar weightSeek = new SeekBar(this);\n        weightSeek.setMax(6);\n        weightSeek.setProgress(Math.max(0, Math.min(6, (fontWeight - 200) / 100)));\n        TextView weightValue = new TextView(this);\n        weightValue.setText(fontWeightDisplay());\n        weightValue.setTextSize(12.5f); weightValue.setTextColor(text); weightValue.setGravity(Gravity.CENTER);\n        weightSeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {\n            @Override public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {\n                if (!fromUser) return;\n                fontWeight = 200 + progress * 100;\n                weightValue.setText(fontWeightDisplay());\n                try {\n                    if (webView != null) webView.evaluateJavascript("(function(){if(document.body)document.body.style.setProperty('font-weight','" + fontWeight + "','important');})()", null);\n                } catch (Exception ignored) {}\n            }\n            @Override public void onStartTrackingTouch(SeekBar seekBar) {}\n            @Override public void onStopTrackingTouch(SeekBar seekBar) { saveReaderPreferences(); applyReaderStyleSmooth(true); }\n        });\n        weightRow.addView(weightSeek, new LinearLayout.LayoutParams(0, dp(44), 1f));\n        weightRow.addView(weightValue, new LinearLayout.LayoutParams(dp(116), dp(44)));\n        card.addView(weightRow);\n\n        addSheetLabel(card, "Line height", sub);'''
          s=rep(s,marker,weight,'font weight slider')

          # Persist/reset weight and keep the advanced list synchronized.
          s=rep(s,'        fontChoice = "publisher";\n        lineSpacing = 160;',
                '        fontChoice = "publisher";\n        fontWeight = 400;\n        lineSpacing = 160;','reset font weight')
          s=rep(s,'                .putString("epub_font_choice", fontChoice)\n',
                '                .putString("epub_font_choice", fontChoice)\n                .putInt("epub_font_weight", fontWeight)\n','save font weight')
          s=rep(s,'        GoogleAutoSync.scheduleSoon(this);\n    }\n\n    private String readingModeDisplayName()',
                '        refreshAdvancedReaderSettingsRows();\n        GoogleAutoSync.scheduleSoon(this);\n    }\n\n    private int normalizeFontWeight(int value) {\n        int w = Math.max(200, Math.min(800, value));\n        return Math.round(w / 100f) * 100;\n    }\n\n    private String fontWeightDisplay() {\n        if (fontWeight <= 300) return fontWeight + " · Thin";\n        if (fontWeight <= 400) return fontWeight + " · Regular";\n        if (fontWeight <= 500) return fontWeight + " · Medium";\n        if (fontWeight <= 600) return fontWeight + " · Semi Bold";\n        return fontWeight + " · Bold";\n    }\n\n    private String readingModeDisplayName()','font weight helpers')

          # Replace auto-dismissing More reader settings with a persistent ListView.
          pattern=re.compile(r'(?ms)^    private void showAdvancedReaderSettings\(\) \{.*?^    \}\n\n    private void showReadingModeDialog\(\) \{')
          m=pattern.search(s)
          if not m: raise SystemExit('advanced reader settings method not found')
          replacement='''    private String[] buildAdvancedReaderOptions() {\n        return new String[]{\n                "Reading mode · " + readingModeDisplayName(),\n                "Page animation · " + pageAnimationDisplayName(),\n                "Text alignment · " + alignmentDisplayName(),\n                "Font size · " + fontPercent + "%",\n                "Font · " + fontDisplayName(),\n                "Font weight · " + fontWeightDisplay(),\n                "Line spacing · " + lineSpacingDisplay(),\n                "Margins · " + marginPercent + "%",\n                "Theme · " + themeDisplayName(),\n                "Brightness · " + brightnessDisplayName(),\n                "Keep screen on · " + onOff(keepScreenOn),\n                "Lock orientation · " + onOff(lockOrientation),\n                "Volume keys navigate · " + onOff(volumeChapterKeys),\n                "Auto scroll · " + onOff(autoScrollEnabled),\n                "Auto scroll speed · " + autoScrollSpeedDisplay(),\n                "30-minute eye reminder · " + onOff(eyeBreakReminderEnabled),\n                "Reset reader settings"\n        };\n    }\n\n    private void refreshAdvancedReaderSettingsRows() {\n        if (advancedReaderAdapter == null) return;\n        String[] fresh = buildAdvancedReaderOptions();\n        advancedReaderAdapter.clear();\n        for (String item : fresh) advancedReaderAdapter.add(item);\n        advancedReaderAdapter.notifyDataSetChanged();\n    }\n\n    private void showAdvancedReaderSettings() {\n        if (isPdf) { showPdfSettings(); return; }\n        if (advancedReaderDialog != null && advancedReaderDialog.isShowing()) {\n            refreshAdvancedReaderSettingsRows();\n            return;\n        }\n        java.util.ArrayList<String> rows = new java.util.ArrayList<>();\n        for (String item : buildAdvancedReaderOptions()) rows.add(item);\n        advancedReaderAdapter = new android.widget.ArrayAdapter<>(this, android.R.layout.simple_list_item_1, rows);\n        android.widget.ListView list = new android.widget.ListView(this);\n        list.setDividerHeight(0);\n        list.setAdapter(advancedReaderAdapter);\n        advancedReaderDialog = new AlertDialog.Builder(this)\n                .setTitle("Reader settings")\n                .setView(list)\n                .setNegativeButton("Close", null)\n                .create();\n        advancedReaderDialog.setOnDismissListener(d -> { advancedReaderDialog = null; advancedReaderAdapter = null; });\n        advancedReaderDialog.show();\n        list.setOnItemClickListener((parent, view, which, id) -> {\n            switch (which) {\n                case 0: showReadingModeDialog(); break;\n                case 1: showPageAnimationDialog(); break;\n                case 2: showAlignmentDialog(); break;\n                case 3: showFontSizeDialog(); break;\n                case 4: showFontDialog(); break;\n                case 5:\n                    fontWeight = fontWeight >= 800 ? 200 : fontWeight + 100;\n                    saveReaderPreferences(); applyReaderStyleSmooth(true); break;\n                case 6: showLineSpacingDialog(); break;\n                case 7: showMarginDialog(); break;\n                case 8: showThemeDialog(); break;\n                case 9: showBrightnessDialog(); break;\n                case 10: keepScreenOn = !keepScreenOn; saveReaderPreferences(); applyWindowPreferences(); break;\n                case 11: lockOrientation = !lockOrientation; saveReaderPreferences(); applyWindowPreferences(); break;\n                case 12: volumeChapterKeys = !volumeChapterKeys; saveReaderPreferences(); break;\n                case 13:\n                    autoScrollEnabled = !autoScrollEnabled; saveReaderPreferences(); autoScrollResumeToken++; updateAutoScrollState(); break;\n                case 14: showAutoScrollSpeedDialog(); break;\n                case 15:\n                    eyeBreakReminderEnabled = !eyeBreakReminderEnabled; saveReaderPreferences();\n                    if (eyeBreakReminderEnabled) scheduleEyeBreakReminder(); else cancelEyeBreakReminder(); break;\n                case 16: resetReaderPreferences(); break;\n            }\n            refreshAdvancedReaderSettingsRows();\n        });\n    }\n\n    private void showReadingModeDialog() {'''
          s=s[:m.start()]+replacement+s[m.end():]
          p.write_text(s,encoding='utf-8')

          # Static checks before invoking Gradle.
          checks={
            'app/src/main/java/com/whisper/wowreader/MainActivity.java':'Notes & Highlight',
            'app/src/main/java/com/whisper/wowreader/DictionaryDialog.java':'wow_dictionary_v2.db',
            'app/src/main/java/com/whisper/wowreader/DictionaryDialog.java':'DictionaryManagerActivity.class',
          }
          if 'translate.google.com' in Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java').read_text(encoding='utf-8'):
              raise SystemExit('Google Translate redirect returned')
          PY

          grep -q 'versionCode 57' app/build.gradle
          grep -q "versionName '2.18.7'" app/build.gradle
          grep -q 'Notes & Highlight' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'wow_dictionary_v2.db' app/src/main/java/com/whisper/wowreader/DictionaryDialog.java
          grep -q 'KindleDictionaryStore.lookup' app/src/main/java/com/whisper/wowreader/DictionaryDialog.java
          grep -q 'my.wiktionary.org/wiki' app/src/main/java/com/whisper/wowreader/DictionaryDialog.java
          grep -q 'epubFontScaleDetector' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'Font weight' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'advancedReaderAdapter' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/assets/dictionary/myanmar_spelling.txt
          test $(wc -c < app/src/main/assets/dictionary/myanmar_spelling.txt) -gt 500000
          git diff --check

      - name: Build release APK AAB debug test and lint
        run: |
          gradle --no-daemon :app:assembleRelease :app:bundleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease --stacktrace

      - name: APK and feature smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"; test -s "$AAB"
          AAPT=${ANDROID_HOME}/build-tools/36.0.0/aapt
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='57'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.7'"
          unzip -l "$APK" | grep -q 'assets/dictionary/wow_dictionary.db'
          unzip -l "$APK" | grep -q 'assets/dictionary/myanmar_spelling.txt'
          unzip -p "$APK" classes.dex | strings | grep -q 'DictionaryManagerActivity'
          unzip -p "$APK" classes.dex | strings | grep -q 'KindleDictionaryStore'
          unzip -p "$APK" classes.dex | strings | grep -q 'Notes & Highlight'

      - name: Collect test artifacts
        run: |
          mkdir -p out
