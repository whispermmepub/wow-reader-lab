name: Fix v54 regression activity cleanup

on:
  push:
    branches: [fix/v54-reader-pdf-oem]
    paths:
      - '.github/workflows/fix-v54-regression-await-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v54-reader-pdf-oem
      - name: Wait for reader destruction between regression cases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/androidTest/java/com/whisper/wowreader/RegressionInstrumentation.java')
          s = p.read_text()
          old = '        ui(() -> {reader.finish();return null;});SystemClock.sleep(300);'
          new = '        ui(() -> {reader.finish();return null;});\n        await(() -> (Boolean)ui(() -> reader.isDestroyed()), "reader destroyed");\n        SystemClock.sleep(200);'
          if old not in s:
              raise SystemExit('cleanup target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app/src/androidTest/java/com/whisper/wowreader/RegressionInstrumentation.java
          git commit -m 'Wait for reader destruction between regression cases'
          git push origin HEAD:fix/v54-reader-pdf-oem
