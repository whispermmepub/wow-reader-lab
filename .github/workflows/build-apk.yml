name: Build WoW Reader Lab v27 unsigned release

on:
  push:
    branches: [test/production-signed-v27]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Verify lab test identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "versionCode 27" app/build.gradle
          grep -q "versionName '2.15.0-lab-test'" app/build.gradle
          test -s app/google-services.json
          test -s app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          test -s app/src/main/java/com/whisper/wowreader/CloudMergePolicy.java
          test -s app/src/main/java/com/whisper/wowreader/BookTypographyStore.java
          git diff --check

      - name: Build release APK and lint
        run: gradle :app:clean :app:assembleRelease :app:lintRelease --stacktrace

      - name: Smoke check unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='27'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.15.0-lab-test'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"

      - name: Collect unsigned APK and local signing tools
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-Lab-v27-unsigned.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          test -s "$APKSIGNER_JAR"
          test -x "$ZIPALIGN"
          cp "$APKSIGNER_JAR" apksigner.jar
          cp "$ZIPALIGN" zipalign
          chmod +x zipalign

      - name: Upload unsigned test build
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v27-unsigned
          path: |
            WoW-Reader-Lab-v27-unsigned.apk
            apksigner.jar
            zipalign
          if-no-files-found: error
          retention-days: 1
