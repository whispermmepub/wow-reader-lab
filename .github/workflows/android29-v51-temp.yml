name: Verify Android 10 API29 fresh install for v51

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android29-v51-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android29-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build v51 debug
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare Android 10 verification script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify-api29-v51.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=com.whisper.wowreader
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          adb uninstall "$PKG" >/dev/null 2>&1 || true
          adb install "$APK"
          adb logcat -c
          adb shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 5
          adb shell dumpsys package "$PKG" | grep -Fq 'versionCode=51'
          adb shell pidof "$PKG" >/dev/null
          adb shell "run-as $PKG sh -c 'ls -d files/library files/cover_cache >/dev/null'"
          LOG="$RUNNER_TEMP/api29-logcat.txt"
          adb logcat -d > "$LOG"
          if grep -A25 -B5 'FATAL EXCEPTION' "$LOG" | grep -Fq "$PKG"; then
            grep -A40 -B10 'FATAL EXCEPTION' "$LOG" || true
            exit 1
          fi
          echo 'Android 10 API29 fresh install launch PASS'
          SCRIPT
          chmod +x "$RUNNER_TEMP/verify-api29-v51.sh"
      - name: Fresh install and launch API 29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_3a
          disable-animations: true
          script: bash "$RUNNER_TEMP/verify-api29-v51.sh"
