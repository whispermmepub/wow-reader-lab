name: Commit WoW Reader v47 footnote card only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-footnote-card-only-v47b-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java')
          s = p.read_text()
          def once(old, new, label):
              global s
              n=s.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 got {n}')
              s=s.replace(old,new,1)
          once('    private boolean footnoteReturnPending = false;\n','    private boolean footnoteReturnPending = false;\n    // A recognized footnote tap must never also trigger page/chapter navigation.\n    private volatile long footnoteTapSuppressUntilMs = 0L;\n','field')
          once('    private void requestFootnotePreview(String href, String label) {\n','    private void requestFootnotePreview(String href, String label, String sourceId) {\n','signature')
          once('        final String sourceId = footnoteReturnSourceId;\n','        final String previewSourceId = sourceId == null ? "" : sourceId;\n','source')
          once('ReaderSearchIndex.resolveFootnote(spine, sourceSpine, footnotePreviewHref, sourceId)','ReaderSearchIndex.resolveFootnote(spine, sourceSpine, footnotePreviewHref, previewSourceId)','resolver')
          once('        String text = note.text == null ? "" : note.text.trim();\n','        String text = cleanFootnoteDisplayText(note.text);\n','body')
          once('        if (text.isEmpty()) text = "Footnote text could not be previewed. You can still open it on the page.";\n','        if (text.isEmpty()) text = "Footnote text could not be previewed.";\n','fallback')
          s,n=re.subn(r'\n        TextView show = new TextView\(this\);.*?\n        card\.addView\(show, showLp\);\n','\n',s,count=1,flags=re.S)
          if n != 1: raise SystemExit(f'show block: {n}')
          marker='    private void showFootnotePreview(ReaderSearchIndex.Footnote note, String label) {\n'
          cleaner='    private String cleanFootnoteDisplayText(String raw) {\n        if (raw == null) return "";\n        String text = raw.replaceAll("\\\\s+", " ").trim();\n        text = text.replaceFirst("(?i)^unknown\\\\s*", "");\n        text = text.replaceFirst("^\\\\[\\\\s*[←↩↵]?\\\\s*-?\\\\s*\\\\d+\\\\s*\\\\]\\\\s*", "");\n        text = text.replaceFirst("^[←↩↵]\\\\s*-?\\\\s*\\\\d+\\\\s*", "");\n        return text.trim();\n    }\n\n'
          if s.count(marker)!=1: raise SystemExit('preview marker')
          s=s.replace(marker,cleaner+marker,1)
          once('                    armFootnoteReturn(targetSourceId);\n                    requestFootnotePreview(targetHref, targetLabel);\n','                    // Card-only footnotes: never navigate away from the reading page.\n                    footnoteNavigationActive = false;\n                    footnoteReturnPending = false;\n                    footnoteReturnArmed = false;\n                    requestFootnotePreview(targetHref, targetLabel, targetSourceId);\n','bridge')
          once('                final String targetSourceId = sourceId == null ? "" : sourceId;\n                runOnUiThread(() -> {\n','                final String targetSourceId = sourceId == null ? "" : sourceId;\n                footnoteTapSuppressUntilMs = android.os.SystemClock.uptimeMillis() + 1400L;\n                runOnUiThread(() -> {\n','suppress bridge')
          once('    private void handleReaderTap(float x, float y) {\n        if (webView == null || chapterLoading || tapHitTestPending) return;\n','    private void handleReaderTap(float x, float y) {\n        if (android.os.SystemClock.uptimeMillis() < footnoteTapSuppressUntilMs) return;\n        if (webView == null || chapterLoading || tapHitTestPending) return;\n','tap early')
          once('                tapHitTestPending = false;\n                if (result != null && (result.contains("link") || result.contains("selection"))) return;\n','                tapHitTestPending = false;\n                if (android.os.SystemClock.uptimeMillis() < footnoteTapSuppressUntilMs) return;\n                if (result != null && (result.contains("link") || result.contains("selection"))) return;\n','tap callback')
          once('    private void turnPageFromTap(int delta, float tapY) {\n        if (webView == null || chapterLoading || !"page".equals(readingMode) || delta == 0) return;\n','    private void turnPageFromTap(int delta, float tapY) {\n        if (android.os.SystemClock.uptimeMillis() < footnoteTapSuppressUntilMs) return;\n        if (webView == null || chapterLoading || !"page".equals(readingMode) || delta == 0) return;\n','page tap')
          once('    public void onBackPressed() {\n        if (bookSearchDialog != null && bookSearchDialog.isShowing())','    public void onBackPressed() {\n        if (footnotePreviewDialog != null && footnotePreviewDialog.isShowing()) { footnotePreviewDialog.dismiss(); return; }\n        if (bookSearchDialog != null && bookSearchDialog.isShowing())','back')
          if 'Show on page' in s: raise SystemExit('Show on page remains')
          p.write_text(s)
          g=Path('app/build.gradle')
          gs=g.read_text()
          if gs.count('versionCode 46')!=1 or gs.count("versionName '2.17.6'")!=1: raise SystemExit('version mismatch')
          g.write_text(gs.replace('versionCode 46','versionCode 47',1).replace("versionName '2.17.6'","versionName '2.17.7'",1))
          PY

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 47" app/build.gradle
          grep -q "versionName '2.17.7'" app/build.gradle
          grep -q 'cleanFootnoteDisplayText' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'footnoteTapSuppressUntilMs' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'Card-only footnotes' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          ! grep -q 'Show on page' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'renderBookSearchResults' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'ReadingProgressStore.set' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          ! grep -q 'showFindDialog' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git diff --check
          gradle :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='47'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.7'"

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/build.gradle
          git commit -m 'Make footnotes card-only and prevent tap page turns'
          git push origin HEAD:main
