name: Apply v63 stability patch

on:
  push:
    branches:
      - fix/v63-stability-scalable-library
    paths:
      - 'tools/v63/apply.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v63/patch.part.* > "$RUNNER_TEMP/v63.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/v63.patch.gz.b64" > "$RUNNER_TEMP/v63.patch.gz"
          gzip -dc "$RUNNER_TEMP/v63.patch.gz" > "$RUNNER_TEMP/v63.patch"
          patch -p1 --forward --batch < "$RUNNER_TEMP/v63.patch"
      - name: Commit v63 repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/v63/patch.part.* tools/v63/apply.trigger
          git config user.name "WoW Reader Release Bot"
          git config user.email "61192036+whispermmepub@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix v63 stability, progress, duplicates and scalable reader state"
          git push origin HEAD:fix/v63-stability-scalable-library
