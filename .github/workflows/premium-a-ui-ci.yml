name: Premium A UI patch and verify

on:
  push:
    branches: [feature/premium-a-ui-v28]
    paths:
      - 'scripts/apply_premium_a_ui.py'
      - '.github/workflows/premium-a-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-a-ui-v28
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply premium A transformation
        run: python scripts/apply_premium_a_ui.py
      - name: Guard source structure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'Continue reading' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'showLibraryFilterSheet' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'showBookActions(File file, View anchor)' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'Reading statistics' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'Notes & highlights' app/src/main/java/com/whisper/wowreader/MainActivity.java
      - name: Commit transformed app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WoW Reader Lab CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/MainActivity.java
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'Implement premium A home and compact actions'
            git push origin HEAD:feature/premium-a-ui-v28
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Compile and lint
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
