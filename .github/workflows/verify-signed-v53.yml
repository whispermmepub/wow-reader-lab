name: Verify production-signed v53 calendar recap

on:
  push:
    branches: [feature/v53-reading-calendar-recap]
    paths: ['.github/workflows/verify-signed-v53.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    env:
      WOW_RELEASE_STORE_PASSWORD: ${{ secrets.WOW_RELEASE_STORE_PASSWORD }}
      WOW_RELEASE_KEY_ALIAS: ${{ secrets.WOW_RELEASE_KEY_ALIAS }}
      WOW_RELEASE_KEY_PASSWORD: ${{ secrets.WOW_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Prepare protected production signing key
        env:
          WOW_RELEASE_KEYSTORE_BASE64: ${{ secrets.WOW_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WOW_RELEASE_KEYSTORE_BASE64"
          test -n "$WOW_RELEASE_STORE_PASSWORD"
          test -n "$WOW_RELEASE_KEY_ALIAS"
          test -n "$WOW_RELEASE_KEY_PASSWORD"
          WOW_RELEASE_STORE_FILE="$RUNNER_TEMP/wow-reader-production.jks"
          printf '%s' "$WOW_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$WOW_RELEASE_STORE_FILE"
          chmod 600 "$WOW_RELEASE_STORE_FILE"
          echo "WOW_RELEASE_STORE_FILE=$WOW_RELEASE_STORE_FILE" >> "$GITHUB_ENV"
      - name: Build, lint and sign v53
        run: gradle :app:clean :app:assembleRelease :app:bundleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease --stacktrace
      - name: Verify exact package, version and production certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='53'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.3'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee v53-cert.txt
          grep -qi '29fca29f8db184aaf51335efbea8c50d51769d7748ae535617c2479e3989aca5' v53-cert.txt
          jarsigner -verify -certs "$AAB"
          sha256sum "$APK" | tee v53-sha256.txt
      - name: Collect production-signed v53
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk WoW-Reader-v2.18.3-v53-production-signed.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-v2.18.3-v53-production-signed.aab
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.18.3-v53-production-signed
          path: |
            WoW-Reader-v2.18.3-v53-production-signed.apk
            WoW-Reader-v2.18.3-v53-production-signed.aab
            v53-cert.txt
            v53-sha256.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v53-debug-regression
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  device-smoke:
    needs: build-signed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            arch: x86
          - api: 29
            arch: x86_64
          - api: 35
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: WoW-Reader-v2.18.3-v53-production-signed
          path: input/v53
      - uses: actions/download-artifact@v4
        with:
          name: v53-debug-regression
          path: input/debug
      - uses: actions/download-artifact@v4
        with:
          name: WoW-Reader-Lab-v2.18.2-v52-production-signed
          run-id: 33992133921
          github-token: ${{ github.token }}
          path: input/v52
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          disable-animations: true
          script: |
            set -euo pipefail
            PKG=com.whisper.wowreader
            V52=$(find input/v52 -type f -name '*.apk' | head -n 1)
            V53=$(find input/v53 -type f -name '*.apk' | head -n 1)
            test -s "$V52"
            test -s "$V53"
            adb root || true
            adb wait-for-device
            adb uninstall "$PKG" >/dev/null 2>&1 || true
            adb install "$V52"
            adb shell am start -W -n "$PKG/.MainActivity"
            sleep 2
            adb shell pidof "$PKG"
            adb install -r "$V53"
            adb shell am start -W -n "$PKG/.MainActivity"
            sleep 2
            adb shell pidof "$PKG"
            adb shell am start -W -n "$PKG/.ReadingCalendarActivity"
            sleep 2
            adb shell uiautomator dump /sdcard/calendar.xml >/dev/null
            adb pull /sdcard/calendar.xml calendar.xml >/dev/null
            grep -q 'text="Week"' calendar.xml
            grep -q 'text="Month"' calendar.xml
            grep -q 'text="Year"' calendar.xml
            grep -q 'View &amp; Share' calendar.xml
            adb shell am start -W -n "$PKG/.ReadingRecapActivity" --el start_ms 0 --el end_ms 4102444799000 --es mode year --es period_label Test
            sleep 2
            adb shell uiautomator dump /sdcard/recap.xml >/dev/null
            adb pull /sdcard/recap.xml recap.xml >/dev/null
            grep -q 'Share Image' recap.xml
            adb uninstall "$PKG"
            adb install "$V53"
            adb shell am start -W -n "$PKG/.MainActivity"
            sleep 2
            adb shell pidof "$PKG"
            echo "API ${{ matrix.api }}: v52->v53 update, Calendar/Recap UI, fresh v53 launch PASS"
