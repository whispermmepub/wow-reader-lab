name: Patch WoW Reader Lab v46

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-reader-footnote-theme-v46-temp.yml
      - tools/v46/apply_patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Apply v46 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v46/apply_patch.py
          grep -q 'versionCode 46' app/build.gradle
          grep -q "versionName '2.17.6'" app/build.gradle
          grep -q 'looksLikeFootnoteDestination' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'resolveTargetSpine' app/src/main/java/com/whisper/wowreader/ReaderSearchIndex.java
          grep -q 'runOnUiThread(BookReaderActivity.this::restoreFootnoteReturn)' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'Theme_DeviceDefault_NoActionBar_Fullscreen' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          ! grep -q 'Theme_Black_NoTitleBar_Fullscreen' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git diff --check

      - name: Build and lint
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace

      - name: Smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='46'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.6'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"

      - name: Commit verified app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/src/main/java/com/whisper/wowreader/ReaderSearchIndex.java
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix footnote interception and theme book search"
          git push origin HEAD:main
