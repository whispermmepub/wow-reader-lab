name: Verify v40 update fresh install and Android range for v51

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compat-v40-v51-ubuntu-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-and-fresh-modern:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36"
      - name: Build v51 and v40 with same debug signer
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/wow-v51.apk"
          git clone --quiet https://github.com/whispermmepub/wow-reader-app.git "$RUNNER_TEMP/wow-old"
          cd "$RUNNER_TEMP/wow-old"
          git checkout --quiet afc75339dece9ff175f8d498a9744fc88bbb6a62
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/wow-v40.apk"
          test -s "$RUNNER_TEMP/wow-v51.apk"
          test -s "$RUNNER_TEMP/wow-v40.apk"
      - name: Prepare compatibility script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify-v51.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=com.whisper.wowreader
          OLD="$RUNNER_TEMP/wow-v40.apk"
          NEW="$RUNNER_TEMP/wow-v51.apk"

          fatal_check() {
            local label="$1"
            if adb logcat -d | grep -A25 -B5 'FATAL EXCEPTION' | grep -Fq "$PKG"; then
              echo "FATAL: $label" >&2
              adb logcat -d | grep -A40 -B10 'FATAL EXCEPTION' || true
              exit 1
            fi
          }
          process_check() {
            local label="$1"
            if ! adb shell pidof "$PKG" >/dev/null; then
              echo "PROCESS NOT RUNNING: $label" >&2
              adb logcat -d | tail -300 || true
              exit 1
            fi
          }
          pref_dump() {
            adb exec-out run-as "$PKG" cat shared_prefs/wow_reader.xml | tr -d '\r'
          }

          echo '=== v40 -> v51 update ==='
          adb uninstall "$PKG" >/dev/null 2>&1 || true
          adb install "$OLD"
          adb shell run-as "$PKG" mkdir -p files/library shared_prefs
          printf 'v40-library-preserved\n' | adb shell "run-as $PKG sh -c 'cat > files/library/__v40_update_sentinel.txt'"
          cat > "$RUNNER_TEMP/wow_reader.xml" <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map>
              <int name="percent_update-test.epub" value="37" />
              <string name="library_shelves_json">{&quot;Favorites&quot;:[&quot;update-test.epub&quot;]}</string>
              <string name="reading_stats_day_notes_json">{&quot;2026-09-05&quot;:&quot;v40 update sentinel&quot;}</string>
              <string name="library_title_update-test.epub">Custom Update Title</string>
              <string name="library_author_update-test.epub">Custom Update Author</string>
              <boolean name="library_metadata_custom_update-test.epub" value="true" />
          </map>
          XML
          cat "$RUNNER_TEMP/wow_reader.xml" | adb shell "run-as $PKG sh -c 'cat > shared_prefs/wow_reader.xml'"
          adb install -r "$NEW"
          adb logcat -c
          adb shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 5
          adb shell dumpsys package "$PKG" | grep -Fq 'versionCode=51'
          adb shell run-as "$PKG" test -f files/library/__v40_update_sentinel.txt
          PREFS=$(pref_dump)
          printf '%s\n' "$PREFS" | grep -Fq 'name="percent_update-test.epub" value="37"'
          printf '%s\n' "$PREFS" | grep -Fq 'library_shelves_json'
          printf '%s\n' "$PREFS" | grep -Fq 'reading_stats_day_notes_json'
          printf '%s\n' "$PREFS" | grep -Fq 'Custom Update Title'
          printf '%s\n' "$PREFS" | grep -Fq 'Custom Update Author'
          printf '%s\n' "$PREFS" | grep -Fq 'library_metadata_custom_update-test.epub'
          process_check 'v40 -> v51 launch'
          fatal_check 'v40 -> v51 launch'

          echo '=== clean -> v51 fresh install ==='
          adb force-stop "$PKG" 2>/dev/null || true
          adb uninstall "$PKG"
          adb install "$NEW"
          adb logcat -c
          adb shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 5
          adb shell dumpsys package "$PKG" | grep -Fq 'versionCode=51'
          adb shell run-as "$PKG" test -d files/library
          adb shell run-as "$PKG" test -d files/cover_cache
          if adb shell run-as "$PKG" test -f files/library/__v40_update_sentinel.txt; then
            echo 'Fresh install retained old sentinel' >&2
            exit 1
          fi
          process_check 'fresh v51 launch'
          fatal_check 'fresh v51 launch'

          cat > compatibility-report.txt <<'REPORT'
          WoW Reader v2.18.1 / versionCode 51
          Package: com.whisper.wowreader
          API 35 emulator
          v2.17.0/v40 -> v51 in-place update: PASS
          Existing local library sentinel: PASS
          Reading progress/shelf/calendar prefs: PASS
          Custom title/author prefs: PASS
          Fresh v51 install and initialization: PASS
          Launch fatal-exception checks: PASS
          REPORT
          SCRIPT
          chmod +x "$RUNNER_TEMP/verify-v51.sh"
      - name: Exercise update and fresh install on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash "$RUNNER_TEMP/verify-v51.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v51-update-fresh-compatibility
          path: compatibility-report.txt
          if-no-files-found: error
          retention-days: 14

  android-range-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            arch: x86
            profile: pixel_2
          - api: 29
            arch: x86_64
            profile: pixel_3a
          - api: 35
            arch: x86_64
            profile: pixel_6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build v51 debug
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Fresh install and launch API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            set -euo pipefail
            PKG=com.whisper.wowreader
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb uninstall "$PKG" >/dev/null 2>&1 || true
            adb install "$APK"
            adb logcat -c
            adb shell am start -W -n "$PKG/.MainActivity" >/dev/null
            sleep 5
            adb shell dumpsys package "$PKG" | grep -Fq 'versionCode=51'
            adb shell pidof "$PKG" >/dev/null
            adb shell run-as "$PKG" test -d files/library
            adb shell run-as "$PKG" test -d files/cover_cache
            if adb logcat -d | grep -A25 -B5 'FATAL EXCEPTION' | grep -Fq "$PKG"; then
              adb logcat -d | grep -A40 -B10 'FATAL EXCEPTION' || true
              exit 1
            fi
