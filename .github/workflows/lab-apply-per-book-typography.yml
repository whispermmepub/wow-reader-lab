name: Apply Per Book Typography Patch

on:
  push:
    branches: [feature/per-book-typography]
    paths:
      - 'tools/lab_phase4_per_book_typography.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/per-book-typography
          fetch-depth: 0
      - name: Apply guarded source patch
        run: python3 tools/lab_phase4_per_book_typography.py
      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Remember typography separately for each book'
          git push origin HEAD:feature/per-book-typography
