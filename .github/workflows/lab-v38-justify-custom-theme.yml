name: WoW Reader Lab v38 Justify Custom Theme
on:
  push:
    branches:
      - feature/lab-v38-justify-custom-theme
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lab-v38-justify-custom-theme
      - name: Verify v38 source contract
        run: |
          set -euxo pipefail
          grep -q "versionCode 38" app/build.gradle
          grep -q "2.16.8-lab-v38" app/build.gradle
          grep -q 'Justify · Normal' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'Justify · Auto spacing' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          ! grep -q 'Auto spacing adjustment ·' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'text-justify:inter-character' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'AppThemePalette.isSupportedTheme' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'showCustomThemeDialog' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'app_custom_theme_seed' app/src/main/java/com/whisper/wowreader/AppThemePalette.java
          grep -q 'customTheme()' app/src/main/java/com/whisper/wowreader/ComingSoonActivity.java
          grep -q 'customTheme()' app/src/main/java/com/whisper/wowreader/ComingSoonDetailActivity.java
          grep -q 'Intent.EXTRA_ALLOW_MULTIPLE,true' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'function nodes()' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile debug release and lint
        run: gradle --no-daemon clean :app:compileDebugJavaWithJavac :app:assembleRelease :app:lintDebug --stacktrace
      - name: Smoke check release APK
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
      - name: Collect unsigned APK and signing tools
        run: |
          mkdir -p out/tools/lib64
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/WoW-Reader-Lab-v38-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" out/tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/tools/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" out/tools/lib64/libc++.so
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v38-unsigned
          path: out/
          retention-days: 2
