name: Verify v40 update and fresh install for v49

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compat-v40-v49-ubuntu-temp.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36"
      - name: Build v49 and v40 debug with same signer
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/wow-v49.apk
          git clone --quiet https://github.com/whispermmepub/wow-reader-app.git /tmp/wow-old
          cd /tmp/wow-old
          git checkout --quiet afc75339dece9ff175f8d498a9744fc88bbb6a62
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/wow-v40.apk
          test -s /tmp/wow-v49.apk
          test -s /tmp/wow-v40.apk
      - name: Exercise v40 update and fresh install
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tools/compat_v49_emulator.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v49-update-fresh-compatibility
          path: compatibility-report.txt
          if-no-files-found: error
          retention-days: 14
