name: Import WoW Reader Baseline

on:
  push:
    paths:
      - '.github/workflows/import-baseline.yml'

permissions:
  contents: write

jobs:
  import-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WoW Reader source
        uses: actions/checkout@v4
        with:
          repository: whispermmepub/wow-reader-app
          ref: f97b6d375b2674d56ab4f5df18d89d84caf8ef0d
          path: source
          fetch-depth: 1

      - name: Checkout lab repository
        uses: actions/checkout@v4
        with:
          repository: whispermmepub/wow-reader-lab
          ref: main
          path: lab
          fetch-depth: 0

      - name: Replace lab contents with source baseline
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            source/ lab/
          cd lab
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to import.'
            exit 0
          fi
          git commit -m 'Import WoW Reader baseline f97b6d3 into lab'
          git push origin HEAD:main
