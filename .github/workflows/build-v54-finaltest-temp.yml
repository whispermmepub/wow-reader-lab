name: Build WoW Reader v54 final test candidate

on:
  push:
    branches: [fix/v54-reader-pdf-oem]
    paths:
      - '.github/workflows/build-v54-finaltest-temp.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Source guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 54" app/build.gradle
          grep -q "versionName '2.18.4'" app/build.gradle
          grep -q "BookImportTypeDetector.resolveExtension" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "saveReaderLocationDurable" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "pdf_reading_mode" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "PdfContinuousView" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "getBindingAdapterPosition" app/src/main/java/com/whisper/wowreader/PdfContinuousView.java
          git diff --check
      - name: Build APKs
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Android lint
        run: gradle :app:lintRelease --stacktrace
      - name: Smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          DBG=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test -s "$DBG"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='54'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.4'"
          cp "$APK" WoW-Reader-v2.18.4-v54-release-unsigned.apk
          cp "$DBG" WoW-Reader-v2.18.4-v54-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk WoW-Reader-v2.18.4-v54-androidTest.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          cp "$APKSIGNER_JAR" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.18.4-v54-test
          path: |
            WoW-Reader-v2.18.4-v54-release-unsigned.apk
            WoW-Reader-v2.18.4-v54-debug.apk
            WoW-Reader-v2.18.4-v54-androidTest.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 14
