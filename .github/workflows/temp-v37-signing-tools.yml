name: Temp v37 Signing Tools
on:
  push:
    branches:
      - feature/lab-v37-annotation-multi-import
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Collect tools
        run: |
          mkdir -p out/lib out/lib64
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" out/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" out/lib64/libc++.so
      - uses: actions/upload-artifact@v4
        with:
          name: v37-signing-tools-complete
          path: out/
          retention-days: 1
