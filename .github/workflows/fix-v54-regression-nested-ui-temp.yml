name: Fix v54 regression nested UI waits

on:
  push:
    branches: [fix/v54-reader-pdf-oem]
    paths:
      - '.github/workflows/fix-v54-regression-nested-ui-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v54-reader-pdf-oem
      - name: Remove nested main-thread dispatch from await predicates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/androidTest/java/com/whisper/wowreader/RegressionInstrumentation.java')
          s = p.read_text()
          replacements = {
            'await(() -> page==(Integer)ui(() -> field("currentPageInChapter")), "return exact page");':
            'await(() -> page==(Integer)field("currentPageInChapter"), "return exact page");',
            'await(() -> (Boolean)ui(() -> reader.isDestroyed()), "reader destroyed");':
            'await(() -> reader.isDestroyed(), "reader destroyed");'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('target not found: ' + old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app/src/androidTest/java/com/whisper/wowreader/RegressionInstrumentation.java
          git commit -m 'Fix nested UI calls in regression waiters'
          git push origin HEAD:fix/v54-reader-pdf-oem
