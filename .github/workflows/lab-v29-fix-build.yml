name: WoW Reader Lab v29 fixes and build

on:
  push:
    branches:
      - feature/lab-v29-navigation-reader-fixes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lab-v29-navigation-reader-fixes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded v29 changes
        run: python scripts/apply_lab_v29_fixes.py

      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          M=app/src/main/java/com/whisper/wowreader/MainActivity.java
          R=app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          G=app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          A=app/src/main/java/com/whisper/wowreader/GoogleAccountAuth.java
          grep -q 'private boolean homeMode = true' "$M"
          grep -q '"Add book", false, this::chooseBook' "$M"
          grep -q 'https://t.me/TheBookR' "$M"
          grep -q 'https://t.me/+rUiqzi2mdhNiNGZl' "$M"
          grep -q 'https://saroatsin.com' "$M"
          grep -q 'whispermmepub.github.io/Review' "$M"
          grep -q 'private final class ReaderWebView extends WebView' "$R"
          grep -q 'suppressNativeToolbar' "$R"
          ! grep -q 'setCustomSelectionActionModeCallback' "$R"
          grep -q 'onScrollReady' "$R"
          grep -q '#4A4033' "$R"
          grep -q 'stableHits<2&&attempt<9' "$R"
          grep -q 'GoogleAuthProvider.getCredential' "$A"
          grep -q 'Scopes.DRIVE_APPFOLDER' "$G"
          grep -q 'smartBackup' "$G"
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q 'versionCode 29' app/build.gradle
          grep -q "versionName '2.15.0-lab-v29'" app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          git diff --check

      - name: Commit transformed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/MainActivity.java \
                  app/src/main/java/com/whisper/wowreader/BookReaderActivity.java \
                  app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Lab v29 WebView selection integration'
            git push origin HEAD:feature/lab-v29-navigation-reader-fixes
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Build debug release and lint
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease --stacktrace

      - name: Smoke check APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.whisper.wowreader' versionCode='29' versionName='2.15.0-lab-v29'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          unzip -l "$APK" | grep -q 'classes.dex'

      - name: Collect unsigned APK and local signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" out/WoW-Reader-Lab-v29-unsigned.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          cp "$BT/zipalign" out/zipalign
          if [ -f "$BT/lib/apksigner.jar" ]; then
            cp "$BT/lib/apksigner.jar" out/apksigner.jar
          else
            APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)
            test -n "$APKSIGNER_JAR"
            cp "$APKSIGNER_JAR" out/apksigner.jar
          fi
          printf '%s\n' \
            'WoW Reader Lab v29' \
            'package=com.whisper.wowreader' \
            'versionCode=29' \
            'versionName=2.15.0-lab-v29' \
            'targetSdk=36' \
            'debug/release compile + lint PASS' \
            'Google auth / Drive appDataFolder / Smart Sync source guards PASS' \
            > out/ci-verification.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v29-unsigned
          path: out/*
          retention-days: 1

      - name: Clean temporary v29 helpers after success
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin feature/lab-v29-navigation-reader-fixes
          git rm -f scripts/apply_lab_v29_fixes.py .github/workflows/lab-v29-fix-build.yml
          git commit -m 'Clean temporary Lab v29 patch helpers'
          git push origin HEAD:feature/lab-v29-navigation-reader-fixes
