name: Patch WoW Reader Lab v43 pull-to-refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pull-to-refresh-v43-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Apply pull-to-refresh patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/whisper/wowreader/MainActivity.java')
          s = p.read_text()
          old = "import androidx.recyclerview.widget.GridLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;"
          new = "import androidx.recyclerview.widget.GridLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\nimport androidx.swiperefreshlayout.widget.SwipeRefreshLayout;"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    private RecyclerView libraryRecycler;\n    private LibraryAdapter libraryAdapter;"
          new = "    private RecyclerView libraryRecycler;\n    private SwipeRefreshLayout swipeRefresh;\n    private LibraryAdapter libraryAdapter;"
          assert old in s
          s = s.replace(old, new, 1)

          old = "        root.addView(libraryRecycler, new FrameLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));"
          new = "        swipeRefresh = new SwipeRefreshLayout(this);\n        swipeRefresh.setColorSchemeColors(themeAccent());\n        swipeRefresh.setProgressBackgroundColorSchemeColor(themeCardSurface());\n        swipeRefresh.setDistanceToTriggerSync(dp(72));\n        swipeRefresh.setSlingshotDistance(dp(96));\n        swipeRefresh.addView(libraryRecycler, new SwipeRefreshLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));\n        swipeRefresh.setOnRefreshListener(() -> {\n            if (homeMode) {\n                // Rebuild Home so Continue Reading and every progress badge read the latest shared value.\n                swipeRefresh.postDelayed(this::buildUi, 180L);\n            } else {\n                refreshLibrary();\n                maybeAutoGoogleSync();\n                swipeRefresh.postDelayed(() -> {\n                    if (swipeRefresh != null) swipeRefresh.setRefreshing(false);\n                }, 260L);\n            }\n        });\n        root.addView(swipeRefresh, new FrameLayout.LayoutParams(\n                ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          g = Path('app/build.gradle')
          t = g.read_text()
          old = "    implementation 'androidx.recyclerview:recyclerview:1.3.2'"
          new = old + "\n    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'"
          assert old in t and 'swiperefreshlayout' not in t
          t = t.replace(old, new, 1)
          g.write_text(t)
          PY
          grep -q 'SwipeRefreshLayout' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'setOnRefreshListener' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'swiperefreshlayout:1.1.0' app/build.gradle
          grep -q "versionCode 43" app/build.gradle
          grep -q "versionName '2.17.3'" app/build.gradle
          git diff --check
      - name: Build and lint patched Lab
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace
      - name: Smoke check v43
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='43'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.3'"
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app
          git commit -m 'Add pull-to-refresh and refresh progress surfaces'
          git push origin HEAD:main
