name: Inspect reader navigation and progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-reader-nav-progress-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Focused reader and home inspection
        shell: bash
        run: |
          set -euo pipefail
          R=app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          M=app/src/main/java/com/whisper/wowreader/MainActivity.java
          echo '=== READER BRIDGE / URL ==='
          grep -n -E 'class ReaderBridge|createReaderWebViewClient|doUpdateVisitedHistory|shouldOverrideUrlLoading|loadCurrentEpubChapter|completePageReady|updateEpubProgress|saveEpubStateOnly|onPage\(|onScroll\(' "$R" || true
          echo '=== MAIN ADAPTER / HOME ==='
          grep -n -E 'class LibraryAdapter|getItemCount|getItemViewType|onBindViewHolder|onCreateViewHolder|buildLibraryHeader|switchToHome|switchToLibrary|homeMode|notifyItemChanged|notifyDataSetChanged|submit\(' "$M" || true
