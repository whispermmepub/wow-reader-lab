name: Build WoW Reader Lab v2.18.4 APK and AAB

on:
  push:
    branches: [main, fix/v54-reader-pdf-oem]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Stable source checks
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/java/com/whisper/wowreader/MainActivity.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderSearchIndex.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingProgressStore.java
          test -s app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingCalendarActivity.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingRecapActivity.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingRecapData.java
          test -s app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          test -s app/src/main/java/com/whisper/wowreader/BookImportTypeDetector.java
          test -s app/src/main/java/com/whisper/wowreader/PdfContinuousView.java
          test -s app/src/main/res/xml/share_paths.xml
          test -s app/google-services.json
          test -s app/src/main/assets/fonts/pyidaungsu_native.ttf
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "minSdk 23" app/build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "versionCode 54" app/build.gradle
          grep -q "versionName '2.18.4'" app/build.gradle
          grep -q "Home search submit is consumed" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "Edit title & author" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "themeControlSurface" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "BookImportTypeDetector.resolveExtension" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "reader_auto_scroll_enabled" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "reader_auto_scroll_speed" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "1 is extra slow" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "saveReaderLocationDurable" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "pdf_reading_mode" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "PdfContinuousView" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "ReadingProgressStore.set" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "getBindingAdapterPosition" app/src/main/java/com/whisper/wowreader/PdfContinuousView.java
          grep -q "finished_at_" app/src/main/java/com/whisper/wowreader/ReadingProgressStore.java
          grep -q '"Week", "Month", "Year"' app/src/main/java/com/whisper/wowreader/ReadingCalendarActivity.java
          grep -q "View & Share" app/src/main/java/com/whisper/wowreader/ReadingCalendarActivity.java
          grep -q "Share Image" app/src/main/java/com/whisper/wowreader/ReadingRecapActivity.java
          grep -q "FileProvider" app/src/main/java/com/whisper/wowreader/ReadingRecapActivity.java
          grep -q "renameShelf" app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          grep -q "deleteShelf" app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          test ! -e app/src/main/java/com/whisper/wowreader/AutoLibrarySync.java
          git diff --check

      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Android lint
        run: gradle :app:lintRelease --stacktrace

      - name: APK and AAB smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='54'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.4'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          unzip -l "$APK" | grep -q 'assets/fonts/pyidaungsu_native.ttf'
          unzip -l "$AAB" | grep -q 'base/assets/fonts/pyidaungsu_native.ttf'

      - name: Collect build artifacts
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-Lab-v2.18.4-v54-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-Lab-v2.18.4-v54-unsigned.aab
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v2.18.4-v54
          path: |
            WoW-Reader-Lab-v2.18.4-v54-unsigned.apk
            WoW-Reader-Lab-v2.18.4-v54-unsigned.aab
            apksigner.jar
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
