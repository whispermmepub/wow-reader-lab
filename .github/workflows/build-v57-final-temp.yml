name: Finalize v57 reader dictionary and library views

on:
  push:
    branches: [feature/v57-dictionary-reader-polish]
    paths:
      - '.github/workflows/build-v57-final-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v57-dictionary-reader-polish
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true

      - name: Apply v57 base patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 - <<'\''PY'\''/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/build-v57-dictionary-reader-temp.yml > /tmp/v57_base_patch.py
          test -s /tmp/v57_base_patch.py
          python3 /tmp/v57_base_patch.py

      - name: Add small grid large grid and API23 compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(s, old, new, label, count=1):
              if old not in s:
                  raise SystemExit('missing marker: ' + label)
              return s.replace(old, new, count)

          # Kindle dictionary API 23 compatibility: use the legacy Html.fromHtml overload below API 24.
          p = Path('app/src/main/java/com/whisper/wowreader/KindleDictionaryStore.java')
          s = p.read_text(encoding='utf-8')
          s = rep(s, 'import android.net.Uri;\n', 'import android.net.Uri;\nimport android.os.Build;\n', 'kindle Build import')
          s = rep(s,
              'CharSequence cs = Html.fromHtml(raw, Html.FROM_HTML_MODE_LEGACY);',
              'CharSequence cs = Build.VERSION.SDK_INT >= Build.VERSION_CODES.N\n' +
              '                    ? Html.fromHtml(raw, Html.FROM_HTML_MODE_LEGACY)\n' +
              '                    : Html.fromHtml(raw);',
              'kindle Html API23')
          p.write_text(s, encoding='utf-8')

          # Library view: preserve the old grid/list preference and add a compatible small-grid preference.
          p = Path('app/src/main/java/com/whisper/wowreader/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          s = rep(s, '    private boolean gridMode;\n',
                  '    private boolean gridMode;\n    private boolean smallGridMode;\n', 'small grid field')
          s = rep(s, '        gridMode = prefs.getBoolean("library_grid", true);\n',
                  '        gridMode = prefs.getBoolean("library_grid", true);\n' +
                  '        smallGridMode = gridMode && prefs.getBoolean("library_small_grid", false);\n',
                  'load small grid')

          old_button = '''        viewModeButton = iconButton(gridMode ? "▦" : "☷");
        viewModeButton.setTextSize(16);
        viewModeButton.setContentDescription("Change library view");
        viewModeButton.setOnClickListener(v -> {
            gridMode = !gridMode;
            prefs.edit().putBoolean("library_grid", gridMode).apply();
            viewModeButton.setText(gridMode ? "▦" : "☷");
            configureLibraryLayout();
            if (libraryAdapter != null) libraryAdapter.notifyDataSetChanged();
        });'''
          new_button = '''        viewModeButton = iconButton(libraryViewIcon());
        viewModeButton.setTextSize(16);
        updateLibraryViewButton();
        viewModeButton.setOnClickListener(v -> cycleLibraryViewMode());'''
          if s.count(old_button) != 2:
              raise SystemExit('expected two library view buttons, found ' + str(s.count(old_button)))
          s = s.replace(old_button, new_button)

          marker = '''    private int calculateLibraryColumns(int widthPx) {'''
          helpers = '''    private String libraryViewIcon() {
        if (!gridMode) return "☷";
        return smallGridMode ? "▦" : "▥";
    }

    private String libraryViewName() {
        if (!gridMode) return "List";
        return smallGridMode ? "Small Grid" : "Large Grid";
    }

    private void updateLibraryViewButton() {
        if (viewModeButton == null) return;
        viewModeButton.setText(libraryViewIcon());
        viewModeButton.setContentDescription("Library view · " + libraryViewName());
    }

    private void setLibraryViewMode(boolean grid, boolean small) {
        gridMode = grid;
        smallGridMode = grid && small;
        prefs.edit().putBoolean("library_grid", gridMode)
                .putBoolean("library_small_grid", smallGridMode).apply();
        updateLibraryViewButton();
        configureLibraryLayout();
        if (libraryAdapter != null) libraryAdapter.notifyDataSetChanged();
    }

    private void cycleLibraryViewMode() {
        if (!gridMode) setLibraryViewMode(true, false);       // List → Large Grid
        else if (!smallGridMode) setLibraryViewMode(true, true); // Large Grid → Small Grid
        else setLibraryViewMode(false, false);               // Small Grid → List
    }

''' + marker
          s = rep(s, marker, helpers, 'library view helpers')

          s = rep(s,
                  '        final float minCardDp = 154f;\n' +
                  '        float usable = Math.max(minCardDp, widthDp - sideDp);\n' +
                  '        int columns = (int) Math.floor((usable + gapDp) / (minCardDp + gapDp));\n' +
                  '        return Math.max(2, Math.min(6, columns));',
                  '        final float minCardDp = smallGridMode ? 108f : 154f;\n' +
                  '        float usable = Math.max(minCardDp, widthDp - sideDp);\n' +
                  '        int columns = (int) Math.floor((usable + gapDp) / (minCardDp + gapDp));\n' +
                  '        int minimum = smallGridMode ? 3 : 2;\n' +
                  '        int maximum = smallGridMode ? 8 : 6;\n' +
                  '        return Math.max(minimum, Math.min(maximum, columns));',
                  'grid column sizes')
          s = rep(s,
                  '        return Math.max(dp(118), (screen - side * 2 - gap * (columns - 1)) / columns);',
                  '        int minimum = smallGridMode ? dp(86) : dp(118);\n' +
                  '        return Math.max(minimum, (screen - side * 2 - gap * (columns - 1)) / columns);',
                  'grid card min width')

          s = rep(s,
                  '        card.setPadding(dp(7), dp(7), dp(7), dp(9));',
                  '        int cardPad = smallGridMode ? dp(5) : dp(7);\n' +
                  '        card.setPadding(cardPad, cardPad, cardPad, smallGridMode ? dp(7) : dp(9));',
                  'grid card padding')
          s = rep(s,
                  '        int innerWidth = Math.max(dp(96), cellWidth - dp(26));',
                  '        int innerWidth = Math.max(smallGridMode ? dp(78) : dp(96),\n' +
                  '                cellWidth - (smallGridMode ? dp(18) : dp(26)));',
                  'grid inner width')
          s = rep(s, '        title.setTextSize(14.5f);',
                  '        title.setTextSize(smallGridMode ? 12.5f : 14.5f);', 'grid title size')
          s = rep(s, '        title.setPadding(dp(2), dp(9), dp(2), 0);',
                  '        title.setPadding(dp(2), smallGridMode ? dp(6) : dp(9), dp(2), 0);', 'grid title padding')
          s = rep(s, '        meta.setTextSize(10.5f);',
                  '        meta.setTextSize(smallGridMode ? 9.25f : 10.5f);', 'grid meta size')

          old_filter = '''        TextView grid = filterChoice("Grid", gridMode);
        TextView list = filterChoice("List", !gridMode);
        grid.setOnClickListener(v -> { if (!gridMode) { gridMode = true; prefs.edit().putBoolean("library_grid", true).apply(); configureLibraryLayout(); refreshLibrary(); dialog.dismiss(); } });
        list.setOnClickListener(v -> { if (gridMode) { gridMode = false; prefs.edit().putBoolean("library_grid", false).apply(); configureLibraryLayout(); refreshLibrary(); dialog.dismiss(); } });
        LinearLayout.LayoutParams half1 = new LinearLayout.LayoutParams(0, dp(40), 1f); half1.rightMargin = dp(5);
        LinearLayout.LayoutParams half2 = new LinearLayout.LayoutParams(0, dp(40), 1f); half2.leftMargin = dp(5);
        viewRow.addView(grid, half1); viewRow.addView(list, half2); sheet.addView(viewRow);'''
          new_filter = '''        TextView largeGrid = filterChoice("Large Grid", gridMode && !smallGridMode);
        TextView smallGrid = filterChoice("Small Grid", gridMode && smallGridMode);
        TextView list = filterChoice("List", !gridMode);
        largeGrid.setOnClickListener(v -> { setLibraryViewMode(true, false); refreshLibrary(); dialog.dismiss(); });
        smallGrid.setOnClickListener(v -> { setLibraryViewMode(true, true); refreshLibrary(); dialog.dismiss(); });
        list.setOnClickListener(v -> { setLibraryViewMode(false, false); refreshLibrary(); dialog.dismiss(); });
        LinearLayout.LayoutParams third1 = new LinearLayout.LayoutParams(0, dp(40), 1f); third1.rightMargin = dp(4);
        LinearLayout.LayoutParams third2 = new LinearLayout.LayoutParams(0, dp(40), 1f); third2.leftMargin = dp(4); third2.rightMargin = dp(4);
        LinearLayout.LayoutParams third3 = new LinearLayout.LayoutParams(0, dp(40), 1f); third3.leftMargin = dp(4);
        viewRow.addView(largeGrid, third1); viewRow.addView(smallGrid, third2); viewRow.addView(list, third3); sheet.addView(viewRow);'''
          s = rep(s, old_filter, new_filter, 'three library view filters')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Source smoke checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 57" app/build.gradle
          grep -q "versionName '2.18.7'" app/build.gradle
          grep -q 'Notes & Highlight' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'Large Grid' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'Small Grid' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'library_small_grid' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'ScaleGestureDetector' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'Font weight' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'DictionaryManagerActivity' app/src/main/AndroidManifest.xml
          grep -q 'Wiktionary Online' app/src/main/java/com/whisper/wowreader/DictionaryDialog.java
          test -s app/src/main/assets/dictionary/myanmar_spelling.txt
          test $(wc -c < app/src/main/assets/dictionary/myanmar_spelling.txt) -gt 500000
          python3 - <<'PY'
          import sqlite3
          db='app/src/main/assets/dictionary/wow_dictionary.db'
          con=sqlite3.connect(db)
          counts=dict(con.execute('select direction,count(*) from entries group by direction').fetchall())
          assert counts.get(0,0)>1000 and counts.get(1,0)>1000, counts
          assert con.execute("select count(*) from entries where direction=0 and headword_norm='book'").fetchone()[0] > 0
          assert con.execute("select count(*) from entries where direction=1 and headword_norm='စာအုပ်'").fetchone()[0] > 0
          con.close()
          print('dictionary smoke ok', counts)
          PY

      - name: Build test release and run lint
        run: gradle :app:clean :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:lintRelease --stacktrace

      - name: Verify APK identity and requested features
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='57'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.7'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          unzip -l "$APK" | grep -q 'assets/dictionary/myanmar_spelling.txt'
          cp "$APK" WoW-Reader-v2.18.7-v57-test-debug.apk
          sha256sum WoW-Reader-v2.18.7-v57-test-debug.apk > WoW-Reader-v2.18.7-v57-test-debug.sha256.txt

      - name: Commit verified v57 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/whisper/wowreader/MainActivity.java app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/src/main/java/com/whisper/wowreader/DictionaryDialog.java app/src/main/java/com/whisper/wowreader/DictionaryManagerActivity.java app/src/main/java/com/whisper/wowreader/KindleDictionaryStore.java app/src/main/java/com/whisper/wowreader/MyanmarSpellingStore.java app/src/main/assets/dictionary/myanmar_spelling.txt app/src/main/assets/dictionary/SPELLING-NOTICE.txt
          git rm -f .github/workflows/build-v57-dictionary-reader-temp.yml .github/workflows/build-v57-final-temp.yml
          git commit -m 'Finalize v57 dictionary reader and library views'
          git push origin HEAD:feature/v57-dictionary-reader-polish

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.18.7-v57-test-debug
          path: |
            WoW-Reader-v2.18.7-v57-test-debug.apk
            WoW-Reader-v2.18.7-v57-test-debug.sha256.txt
          if-no-files-found: error
          retention-days: 30
