name: Probe v55 dictionary JSON fetch pattern

on:
  push:
    branches: [feature/v55-inapp-dictionary]
    paths:
      - '.github/workflows/build-v55-dictionary-data-temp.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v55-inapp-dictionary
      - name: Inspect Kaikki page JavaScript and one word JSON endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import html,re,urllib.parse,urllib.request
          UA={'User-Agent':'WoW-Reader-dictionary-builder/1.0 (+https://github.com/whispermmepub/wow-reader-lab)'}
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=r.read(); print('GET',r.status,r.headers.get('content-type'),r.geturl(),'bytes',len(data)); return data
          page='https://kaikki.org/dictionary/English/categories-other/my/Terms%20with%20Burmese%20translations/ASEAN--Atthadassi.html'
          body=get(page).decode('utf-8','replace')
          needle='encodeURIComponent(fn) + ".json"'
          i=body.find(needle)
          print('needle index',i)
          print(body[max(0,i-5000):i+5000])
          # Also inspect Arabic word page, which is known to be in this category.
          word='https://kaikki.org/dictionary/English/meaning/A/Ar/Arabic.html'
          wb=get(word).decode('utf-8','replace')
          j=wb.find(needle)
          print('WORD CONTEXT',wb[max(0,j-5000):j+5000])
          # Print fetch(...) snippets from both pages.
          for label,txt in [('category',body),('word',wb)]:
