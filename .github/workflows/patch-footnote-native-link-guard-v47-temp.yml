name: Add v47 native link tap guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-footnote-native-link-guard-v47-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        shell: bash
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Patch native anchor guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java')
          s=p.read_text()
          old='''    private void handleReaderTap(float x, float y) {
        if (android.os.SystemClock.uptimeMillis() < footnoteTapSuppressUntilMs) return;
        if (webView == null || chapterLoading || tapHitTestPending) return;

        final float ratio = x / Math.max(1f, webView.getWidth());
'''
          new='''    private void handleReaderTap(float x, float y) {
        if (android.os.SystemClock.uptimeMillis() < footnoteTapSuppressUntilMs) return;
        if (webView == null || chapterLoading || tapHitTestPending) return;
        // Native WebView hit testing is density-safe and prevents an anchor tap from
        // being interpreted as an edge page-turn while the DOM click is dispatched.
        try {
            android.webkit.WebView.HitTestResult nativeHit = webView.getHitTestResult();
            if (nativeHit != null) {
                int hitType = nativeHit.getType();
                if (hitType == android.webkit.WebView.HitTestResult.SRC_ANCHOR_TYPE ||
                        hitType == android.webkit.WebView.HitTestResult.SRC_IMAGE_ANCHOR_TYPE) return;
            }
        } catch (Exception ignored) {}

        final float ratio = x / Math.max(1f, webView.getWidth());
'''
          if s.count(old)!=1: raise SystemExit(f'handleReaderTap target count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          grep -q 'SRC_ANCHOR_TYPE' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'footnoteTapSuppressUntilMs' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          ! grep -q 'Show on page' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "versionCode 47" app/build.gradle
          git diff --check
          gradle :app:assembleRelease :app:lintRelease --stacktrace
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git commit -m 'Guard footnote links from reader edge page turns'
          git push origin HEAD:main
