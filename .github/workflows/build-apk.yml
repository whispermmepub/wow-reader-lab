name: Build WoW Reader Lab v2.18.1 APK and AAB

on:
  push:
    branches: [main, play-store-api36]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Source checks
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/java/com/whisper/wowreader/MainActivity.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderSearchIndex.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingProgressStore.java
          test -s app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingCalendarActivity.java
          test -s app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          test -s app/google-services.json
          test -s app/src/main/assets/fonts/pyidaungsu_native.ttf
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "minSdk 23" app/build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "versionCode 51" app/build.gradle
          grep -q "versionName '2.18.1'" app/build.gradle
          grep -q "Home search submit is consumed" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "IME_ACTION_SEARCH" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "setOnEditorActionListener" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "reader_auto_scroll_enabled" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "reader_auto_scroll_speed" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "reader_eye_break_reminder" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "onAutoScrollEnd" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "autoScrollManualReturnSpine" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "remembered >= 995 ? 0 : remembered" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "Math.min(300, fontPercent + 10)" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "260, 280, 300" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "EYE_BREAK_INTERVAL_MS" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "showAutoScrollSpeedDialog" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "30 min reminder" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "Edit title & author" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "library_metadata_custom_" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "Book details saved" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "Use book metadata" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "onReaderLinkTap" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "installReaderLinkNavigation(view)" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "footnotePreviewOverlay" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "Show on page" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "looksLikeExplicitBacklinkHref" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "handleFootnoteBacklink" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "footnoteExactBacklinkPending" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "renderBookSearchResults" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "ReaderSearchIndex.search" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "ReadingProgressStore.set" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          ! grep -q "showFindDialog" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "renameShelf" app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          grep -q "deleteShelf" app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          test ! -e app/src/main/java/com/whisper/wowreader/AutoLibrarySync.java
          git diff --check

      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Android lint
        run: gradle :app:lintRelease --stacktrace

      - name: APK smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='51'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.1'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          unzip -l "$APK" | grep -q 'assets/fonts/pyidaungsu_native.ttf'
          unzip -l "$AAB" | grep -q 'base/assets/fonts/pyidaungsu_native.ttf'

      - name: Collect APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-Lab-v2.18.1-v51-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-Lab-v2.18.1-v51-unsigned.aab
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v2.18.1-v51
          path: |
            WoW-Reader-Lab-v2.18.1-v51-unsigned.apk
            WoW-Reader-Lab-v2.18.1-v51-unsigned.aab
            apksigner.jar
          if-no-files-found: error
          retention-days: 14
