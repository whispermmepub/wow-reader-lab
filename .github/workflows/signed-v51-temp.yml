name: Build signed WoW Reader Lab v2.18.1 v51 candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/signed-v51-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-lab-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WOW_RELEASE_STORE_PASSWORD: ${{ secrets.WOW_RELEASE_STORE_PASSWORD }}
      WOW_RELEASE_KEY_ALIAS: ${{ secrets.WOW_RELEASE_KEY_ALIAS }}
      WOW_RELEASE_KEY_PASSWORD: ${{ secrets.WOW_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Verify candidate source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "minSdk 23" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "versionCode 51" app/build.gradle
          grep -q "versionName '2.18.1'" app/build.gradle
          grep -q "autoScrollManualReturnSpine" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "Math.min(300, fontPercent + 10)" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "Edit title & author" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "library_metadata_custom_" app/src/main/java/com/whisper/wowreader/MainActivity.java
      - name: Prepare protected Production signing identity
        env:
          WOW_RELEASE_KEYSTORE_BASE64: ${{ secrets.WOW_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WOW_RELEASE_KEYSTORE_BASE64"
          test -n "$WOW_RELEASE_STORE_PASSWORD"
          test -n "$WOW_RELEASE_KEY_ALIAS"
          test -n "$WOW_RELEASE_KEY_PASSWORD"
          WOW_RELEASE_STORE_FILE="$RUNNER_TEMP/wow-reader-production.jks"
          printf '%s' "$WOW_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$WOW_RELEASE_STORE_FILE"
          chmod 600 "$WOW_RELEASE_STORE_FILE"
          echo "WOW_RELEASE_STORE_FILE=$WOW_RELEASE_STORE_FILE" >> "$GITHUB_ENV"
      - name: Build lint and sign Lab candidate
        run: gradle :app:clean :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace
      - name: Verify signed identity and package
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='51'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.1'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -certs "$AAB"
          "$APKSIGNER" verify --print-certs "$APK" | grep -qi '21:17:d3:1e:01:eb:24:ea:e3:fe:4a:26:88:c8:c7:12:cd:76:71:f1'
          keytool -printcert -jarfile "$AAB" | grep -qi '21:17:d3:1e:01:eb:24:ea:e3:fe:4a:26:88:c8:c7:12:cd:76:71:f1'
          sha256sum "$APK" > WoW-Reader-Lab-v2.18.1-v51-signed.sha256.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > WoW-Reader-Lab-v2.18.1-v51-signature.txt
      - name: Collect signed candidate
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk WoW-Reader-Lab-v2.18.1-v51-production-signed-update-fresh-test.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-Lab-v2.18.1-v51-production-signed.aab
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v2.18.1-v51-production-signed
          path: |
            WoW-Reader-Lab-v2.18.1-v51-production-signed-update-fresh-test.apk
            WoW-Reader-Lab-v2.18.1-v51-production-signed.aab
            WoW-Reader-Lab-v2.18.1-v51-signed.sha256.txt
            WoW-Reader-Lab-v2.18.1-v51-signature.txt
          if-no-files-found: error
          retention-days: 14
