name: Apply Manual Smart Sync Routing

on:
  push:
    branches: [feature/smart-sync-merge]
    paths:
      - 'tools/lab_phase5b_manual_smart_sync.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smart-sync-merge
          fetch-depth: 0
      - name: Route manual backup through smart merge
        run: python3 tools/lab_phase5b_manual_smart_sync.py
      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/MainActivity.java
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Route manual cloud backup through Smart Sync'
          git push origin HEAD:feature/smart-sync-merge
