name: Apply WoW Reader Lab v42 calendar polish

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_v42_calendar_polish.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lab main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe calendar polish
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v42_calendar_polish.py
          git diff --check
          grep -q 'ScrollView scroll = new ScrollView' app/src/main/java/com/whisper/wowreader/ReadingCalendarActivity.java
          grep -q 'hasDailyNote' app/src/main/java/com/whisper/wowreader/ReadingCalendarActivity.java
          grep -q 'onRestart()' app/src/main/java/com/whisper/wowreader/ReadingDayActivity.java
          grep -q 'onRestart()' app/src/main/java/com/whisper/wowreader/ReadingMemoryActivity.java

      - name: Commit polish source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/ReadingCalendarActivity.java \
                  app/src/main/java/com/whisper/wowreader/ReadingDayActivity.java \
                  app/src/main/java/com/whisper/wowreader/ReadingMemoryActivity.java
          git diff --cached --check
          git commit -m 'Polish v42 reading calendar layout'
          git push origin HEAD:main
