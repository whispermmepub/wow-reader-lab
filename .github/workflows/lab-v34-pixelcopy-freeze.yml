name: WoW Reader Lab v34 PixelCopy Chapter Freeze

on:
  push:
    branches:
      - feature/lab-v34-pixelcopy-chapter-freeze

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply v34 PixelCopy freeze patch
        run: python3 scripts/apply_lab_v34_pixelcopy_freeze.py

      - name: Verify outgoing chapter freeze contract
        shell: bash
        run: |
          set -euo pipefail
          R=app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          G=app/build.gradle
          grep -q 'android.view.PixelCopy.request' "$R"
          grep -q 'chapterTransitionCapturePending' "$R"
          grep -q 'chapterTransitionLoadDeferred' "$R"
          grep -q 'installChapterTransitionSnapshot' "$R"
          grep -q 'ImageView.ScaleType.FIT_XY' "$R"
          grep -q 'versionCode 34' "$G"
          grep -q "versionName '2.16.4-lab-v34'" "$G"
          python3 - <<'PY'
          from pathlib import Path
          t=Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java').read_text()
          a=t.index('private void prepareChapterTransition')
          b=t.index('private boolean finishPendingChapterCurl', a)
          block=t[a:b]
          assert 'PixelCopy.request' in block
          assert 'Bitmap shot = captureWebViewBitmap()' not in block
          assert 'Bitmap fallback = captureWebViewBitmap()' in block
          assert 'webView.setAlpha(0f)' not in block.split('PixelCopy.request')[0]
          print('v34 outgoing-freeze source contract PASS')
          PY
          git diff --check

      - name: Commit clean v34 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git rm scripts/apply_lab_v34_pixelcopy_freeze.py
          git rm .github/workflows/lab-v34-pixelcopy-freeze.yml
          git add app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/build.gradle
          git commit -m 'Freeze outgoing chapter with compositor pixels in v34'
          git push origin HEAD:feature/lab-v34-pixelcopy-chapter-freeze

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true

      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Compile debug release and lint
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease --stacktrace

      - name: Smoke check release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.whisper.wowreader' versionCode='34' versionName='2.16.4-lab-v34'" /tmp/badging.txt

      - name: Collect unsigned APK and signing tools
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/WoW-Reader-Lab-v34-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" out/apksigner

      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v34-unsigned
          path: out/
          retention-days: 2
