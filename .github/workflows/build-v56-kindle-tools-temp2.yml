name: Verify v56 Kindle tools and PDF selection

on:
  push:
    branches: [feature/v56-kindle-tools-pdf-selection]
    paths:
      - '.github/workflows/build-v56-kindle-tools-temp2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v56-kindle-tools-pdf-selection
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true

      - name: Apply verified v56 integration patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 - <<.PY./ {inside=1; next}
            inside && /^          PY$/ {exit}
            inside {sub(/^          /, ""); print}
          ' .github/workflows/build-v56-kindle-tools-temp.yml > /tmp/v56_integrate.py
          test -s /tmp/v56_integrate.py
          python3 /tmp/v56_integrate.py
          grep -q 'Vocabulary Builder' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'beginAutoScrollInteraction' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'Reading ruler' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'VocabularyStore.record' app/src/main/java/com/whisper/wowreader/DictionaryDialog.java
          grep -q 'VocabularyActivity' app/src/main/AndroidManifest.xml
          ! grep -R 'translate.google.com' app/src/main/java/com/whisper/wowreader
          git diff --check

      - name: Build release APK AAB debug and lint
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease :app:assembleDebug :app:lintRelease --stacktrace

      - name: APK and feature smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=${ANDROID_HOME}/build-tools/36.0.0/aapt
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='56'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.6'"
          unzip -l "$APK" | grep -q 'assets/dictionary/wow_dictionary.db'
          unzip -l "$AAB" | grep -q 'base/assets/dictionary/wow_dictionary.db'
          test -s app/src/main/java/com/whisper/wowreader/VocabularyActivity.java
          test -s app/src/main/java/com/whisper/wowreader/PdfTextRepository.java
          test -s app/src/main/java/com/whisper/wowreader/PdfHighlightStore.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingRulerView.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingEstimateStore.java

      - name: Collect test artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/WoW-Reader-v2.18.6-v56-kindle-tools-unsigned.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/WoW-Reader-v2.18.6-v56-kindle-tools-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab out/WoW-Reader-v2.18.6-v56-kindle-tools-unsigned.aab
          cp tools/dictionary-build-report.txt out/dictionary-build-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.18.6-v56-kindle-tools-test
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified v56 source and clean temp workflows
        if: success()
        shell: bash
        run: |
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git rm .github/workflows/build-v56-kindle-tools-temp.yml .github/workflows/build-v56-kindle-tools-temp2.yml
          git add app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/src/main/java/com/whisper/wowreader/DictionaryDialog.java app/src/main/java/com/whisper/wowreader/MainActivity.java
          git commit -m 'Add Kindle reading tools and PDF text selection'
          git push origin HEAD:feature/v56-kindle-tools-pdf-selection
