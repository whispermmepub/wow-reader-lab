name: Build WoW Reader Lab v2.17.1 APK and AAB

on:
  push:
    branches: [main, play-store-api36]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Source checks
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/java/com/whisper/wowreader/MainActivity.java
          test -s app/src/main/java/com/whisper/wowreader/EpubUtil.java
          test -s app/src/main/java/com/whisper/wowreader/PageCurlView.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderAnnotationStore.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderFontStore.java
          test -s app/src/main/java/com/whisper/wowreader/SplashActivity.java
          test -s app/src/main/java/com/whisper/wowreader/GoogleAccountAuth.java
          test -s app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          test -s app/google-services.json
          test -s app/src/main/res/drawable/wow_logo.xml
          test -s app/src/main/assets/fonts/pyidaungsu_native.ttf
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "versionCode 41" app/build.gradle
          grep -q "versionName '2.17.1'" app/build.gradle
          test ! -e app/src/main/java/com/whisper/wowreader/AutoLibrarySync.java
          test ! -d cloudflare/telegram-auto-library
          ! grep -R -q "AutoLibrarySync\|auto_library_last_id" app/src/main/java || false
          git diff --check

      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Android lint
        run: gradle :app:lintRelease --stacktrace

      - name: APK smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='41'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.1'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          unzip -l "$APK" | grep -q 'assets/fonts/pyidaungsu_native.ttf'
          unzip -l "$AAB" | grep -q 'base/assets/fonts/pyidaungsu_native.ttf'

      - name: Collect APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-Lab-v2.17.1-v41-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-Lab-v2.17.1-v41-unsigned.aab
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v2.17.1-v41
          path: |
            WoW-Reader-Lab-v2.17.1-v41-unsigned.apk
            WoW-Reader-Lab-v2.17.1-v41-unsigned.aab
            apksigner.jar
          if-no-files-found: error
          retention-days: 14
