name: Prepare v55 offline dictionary data

on:
  push:
    branches: [feature/v55-inapp-dictionary]
    paths:
      - '.github/workflows/build-v55-dictionary-data-temp.yml'

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v55-inapp-dictionary
          fetch-depth: 1

      - name: Build CC BY-SA offline English-Myanmar dictionary pack
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, html, json, re, sqlite3, threading, time, urllib.parse, urllib.request
          from pathlib import Path

          UA={'User-Agent':'WoW-Reader-dictionary-builder/1.0 (+https://github.com/whispermmepub/wow-reader-lab)'}
          def get(url, timeout=90, tries=3):
              last=None
              for attempt in range(tries):
                  try:
                      req=urllib.request.Request(url,headers=UA)
                      with urllib.request.urlopen(req,timeout=timeout) as r:return r.read()
                  except Exception as e:
                      last=e; time.sleep(0.35*(attempt+1))
              raise last

          out_dir=Path('app/src/main/assets/dictionary'); out_dir.mkdir(parents=True,exist_ok=True)
          db_path=out_dir/'wow_dictionary.db'
          if db_path.exists(): db_path.unlink()
          db=sqlite3.connect(db_path)
          db.execute('PRAGMA journal_mode=OFF'); db.execute('PRAGMA synchronous=OFF')
          db.execute('CREATE TABLE entries (id INTEGER PRIMARY KEY, headword TEXT NOT NULL, headword_norm TEXT NOT NULL, direction INTEGER NOT NULL, pos TEXT, meaning TEXT NOT NULL, sense TEXT, roman TEXT, source TEXT NOT NULL)')
          db.execute('CREATE INDEX idx_entries_lookup ON entries(direction, headword_norm)')
          db.execute('CREATE INDEX idx_entries_headword ON entries(headword)')
          seen=set(); my_rows=0; en_rows=0
          def norm(s): return ' '.join((s or '').strip().casefold().split())
          def add(headword,direction,pos,meaning,sense='',roman='',source='Wiktionary'):
              h=(headword or '').strip(); m=(meaning or '').strip()
              if not h or not m:return False
              key=(norm(h),direction,m,(pos or '').strip(),(sense or '').strip())
              if key in seen:return False
              seen.add(key)
              db.execute('INSERT INTO entries(headword,headword_norm,direction,pos,meaning,sense,roman,source) VALUES(?,?,?,?,?,?,?,?)',
                         (h,norm(h),direction,(pos or '').strip(),m,(sense or '').strip(),(roman or '').strip(),source))
              return True

          # Myanmar -> English: complete Burmese subset from the English Wiktionary extraction.
          burmese_url='https://kaikki.org/dictionary/Burmese/kaikki.org-dictionary-Burmese.jsonl'
          for line in get(burmese_url,120).decode('utf-8','replace').splitlines():
              if not line.strip():continue
              try:obj=json.loads(line)
              except Exception:continue
              word=obj.get('word',''); pos=obj.get('pos',''); roman=''
              for f in obj.get('forms') or []:
                  if 'romanization' in (f.get('tags') or []):roman=f.get('form','');break
              for sense in obj.get('senses') or []:
                  for gloss in sense.get('glosses') or []:
                      if add(word,1,pos,gloss,'',roman):my_rows+=1
          print('Myanmar->English rows',my_rows,flush=True)

          # English -> Myanmar: discover exactly the English word pages whose senses are tagged
          # "Terms with Burmese translations", then fetch each small per-word raw JSONL endpoint.
          cat='https://kaikki.org/dictionary/English/categories-other/my/Terms%20with%20Burmese%20translations/'
          index_url=cat+'index.html'; idx=get(index_url).decode('utf-8','replace')
          chunks=[]
          for h in re.findall(r'href=["\']([^"\']+\.html)["\']',idx,re.I):
              h=html.unescape(h)
              if '--' in urllib.parse.unquote(h.rsplit('/',1)[-1]) and h not in chunks:chunks.append(h)
          if len(chunks)<20:raise SystemExit(f'Unexpected category index: {len(chunks)} chunks')

          word_urls=set()
          for n,h in enumerate(chunks,1):
              page=urllib.parse.urljoin(index_url,h)
              body=get(page,60).decode('utf-8','replace')
              for w in re.findall(r'href=["\']([^"\']*?/meaning/[^"\']+?\.html)(?:#[^"\']*)?["\']',body,re.I):
                  w=html.unescape(w)
                  full=urllib.parse.urljoin(page,w).split('#',1)[0]
                  if '/dictionary/English/meaning/' in full:word_urls.add(full[:-5]+'.jsonl')
          print('English candidate word JSONL files',len(word_urls),flush=True)
          if len(word_urls)<1500:raise SystemExit(f'Too few English candidate words: {len(word_urls)}')

          failed=[]; rows=[]; lock=threading.Lock(); done=0
          def fetch_word(url):
              nonlocal_done=None
              try: raw=get(url,60,4).decode('utf-8','replace')
              except Exception as e:return url,[],str(e)
              found=[]
              for line in raw.splitlines():
                  if not line.strip():continue
                  try:obj=json.loads(line)
                  except Exception:continue
                  if obj.get('lang_code')!='en':continue
                  word=obj.get('word','');pos=obj.get('pos','')
                  trans=list(obj.get('translations') or [])
                  for sense in obj.get('senses') or []:trans.extend(sense.get('translations') or [])
                  for tr in trans:
                      if (tr.get('lang_code') or tr.get('code'))=='my':
                          found.append((word,pos,tr.get('word',''),tr.get('sense',''),tr.get('roman','')))
              return url,found,None

          urls=sorted(word_urls)
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
              futures=[ex.submit(fetch_word,u) for u in urls]
              for i,f in enumerate(concurrent.futures.as_completed(futures),1):
                  url,found,err=f.result()
                  if err:failed.append((url,err))
                  rows.extend(found)
                  if i%250==0:print('fetched',i,'/',len(urls),'translation records',len(rows),'failed',len(failed),flush=True)

          for word,pos,meaning,sense,roman in rows:
              if add(word,0,pos,meaning,sense,roman):en_rows+=1
          print('English->Myanmar rows',en_rows,'failed word files',len(failed),flush=True)

          db.execute('CREATE TABLE metadata (key TEXT PRIMARY KEY, value TEXT NOT NULL)')
          meta={
            'schema_version':'1','source':'English Wiktionary via Kaikki.org / Wiktextract','license':'CC BY-SA 4.0',
            'source_burmese':burmese_url,'source_english_category':index_url,
            'my_to_en_rows':str(my_rows),'en_to_my_rows':str(en_rows),'english_word_files':str(len(urls)),
            'english_fetch_failures':str(len(failed))}
          db.executemany('INSERT INTO metadata(key,value) VALUES(?,?)',meta.items())
          db.commit();db.execute('VACUUM');db.close()
          if my_rows<5000:raise SystemExit(f'Burmese dataset too small: {my_rows}')
          if en_rows<2000:raise SystemExit(f'English->Myanmar dataset too small: {en_rows}')
          if len(failed)>max(100,len(urls)//20):raise SystemExit(f'Too many English fetch failures: {len(failed)}/{len(urls)}')

          (out_dir/'NOTICE.md').write_text('''# WoW Reader offline dictionary data\n\nThe bundled `wow_dictionary.db` is a transformed subset of English Wiktionary data extracted through Kaikki.org/Wiktextract. It contains Burmese dictionary entries with English glosses and English entries with Burmese translations.\n\nDictionary data is distributed under the Creative Commons Attribution-ShareAlike 4.0 International license (CC BY-SA 4.0), consistent with Wiktionary licensing. WoW Reader transforms source data into a compact SQLite lookup database; no images, audio, or example quotations are bundled.\n\nSources:\n- https://en.wiktionary.org/\n- https://kaikki.org/dictionary/\n- https://github.com/tatuylonen/wiktextract\n\nLicense:\n- https://creativecommons.org/licenses/by-sa/4.0/\n\nWoW Reader application source code and this dictionary database are separate works; this notice applies to the dictionary data asset.\n''',encoding='utf-8')
          Path('tools').mkdir(exist_ok=True)
          Path('tools/dictionary-build-report.txt').write_text(
              f'my_to_en_rows={my_rows}\nen_to_my_rows={en_rows}\nenglish_word_files={len(urls)}\nenglish_fetch_failures={len(failed)}\ndb_bytes={db_path.stat().st_size}\n',encoding='utf-8')
          print(Path('tools/dictionary-build-report.txt').read_text(),flush=True)
          PY
          ls -lh app/src/main/assets/dictionary/wow_dictionary.db
          sqlite3 app/src/main/assets/dictionary/wow_dictionary.db 'select direction,count(*) from entries group by direction;'
          sqlite3 app/src/main/assets/dictionary/wow_dictionary.db "select headword,meaning from entries where direction=0 and headword_norm='hello' limit 5;" || true

      - name: Commit generated dictionary pack and remove temporary builder
        shell: bash
        run: |
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git rm .github/workflows/build-v55-dictionary-data-temp.yml
          git add app/src/main/assets/dictionary tools/dictionary-build-report.txt
          git commit -m 'Add offline English Myanmar dictionary data'
          git push origin HEAD:feature/v55-inapp-dictionary
