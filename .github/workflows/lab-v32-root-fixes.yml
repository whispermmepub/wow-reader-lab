name: WoW Reader Lab v32 Root Fixes

on:
  push:
    branches:
      - feature/lab-v32-chapter-boundary-no-animation
    paths:
      - '.github/workflows/lab-v32-root-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  root-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lab-v32-chapter-boundary-no-animation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded root fixes
        run: python3 scripts/apply_lab_v32_root_fixes.py

      - name: Verify reader and inset source contract
        shell: bash
        run: |
          set -euo pipefail
          R=app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          M=app/src/main/java/com/whisper/wowreader/MainActivity.java
          C=app/src/main/java/com/whisper/wowreader/ComingSoonActivity.java
          D=app/src/main/java/com/whisper/wowreader/ComingSoonDetailActivity.java
          S=app/src/main/java/com/whisper/wowreader/SplashActivity.java
          I=app/src/main/java/com/whisper/wowreader/AppWindowInsets.java
          G=app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          A=app/src/main/java/com/whisper/wowreader/GoogleAccountAuth.java
          F=app/src/main/java/com/whisper/wowreader/ComingSoonFeed.java

          grep -q 'Legacy v2.4/v2.5 paper-curl gesture is intentionally retired' "$R"
          grep -q 'pageCurlView = null;' "$R"
          ! grep -q 'pageCurlView = new PageCurlView' "$R"
          grep -q 's.setUseWideViewPort(false)' "$R"
          grep -q 's.setLoadWithOverviewMode(false)' "$R"
          grep -q 'setTextZoom(Math.max(80, Math.min(200, fontPercent)))' "$R"
          grep -q 'body{font-size:100%' "$R"
          grep -q "querySelectorAll('div,section,article,main,p,blockquote,dd,dt')" "$R"
          grep -q 'getInsetsIgnoringVisibility' "$R"
          grep -q 'Chapter boundaries are intentionally animation-free' "$R"

          test -s "$I"
          grep -q 'WindowInsets.Type.systemBars()' "$I"
          grep -q 'WindowInsets.Type.displayCutout()' "$I"
          grep -q 'setDecorFitsSystemWindows(false)' "$I"
          grep -q 'AppWindowInsets.apply(this, root' "$M"
          grep -q 'AppWindowInsets.apply(this, root' "$C"
          grep -q 'AppWindowInsets.apply(this, root' "$D"
          grep -q 'AppWindowInsets.apply(this, root' "$S"

          grep -q 'GoogleAuthProvider.getCredential' "$A"
          grep -q 'Scopes.DRIVE_APPFOLDER' "$G"
          grep -q 'smartBackup' "$G"
          grep -q 'whisper1of.blogspot.com' "$F"
          grep -q 'thetpaingwrites.blogspot.com' "$F"
          grep -q 'youthsbookreflections.blogspot.com' "$F"
          grep -q 'versionCode 32' app/build.gradle
          grep -q "versionName '2.16.2-lab-v32'" app/build.gradle
          git diff --check

      - name: Commit validated root fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/BookReaderActivity.java \
                  app/src/main/java/com/whisper/wowreader/MainActivity.java \
                  app/src/main/java/com/whisper/wowreader/ComingSoonActivity.java \
                  app/src/main/java/com/whisper/wowreader/ComingSoonDetailActivity.java \
                  app/src/main/java/com/whisper/wowreader/SplashActivity.java \
                  app/src/main/java/com/whisper/wowreader/AppWindowInsets.java
          if ! git diff --cached --quiet; then
            git commit -m 'Fix legacy reader scaling, system insets and scroll font zoom'
            git push origin HEAD:feature/lab-v32-chapter-boundary-no-animation
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Compile debug release and lint
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease --stacktrace

      - name: Smoke check release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.whisper.wowreader' versionCode='32' versionName='2.16.2-lab-v32'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt

      - name: Collect unsigned APK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" out/WoW-Reader-Lab-v32-unsigned.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          cp "$BT/zipalign" out/zipalign
          cp "$BT/lib/apksigner.jar" out/apksigner.jar
          cat > out/ci-verification.txt <<'EOF'
          WoW Reader Lab v32 root fixes
          package=com.whisper.wowreader
          versionCode=32
          versionName=2.16.2-lab-v32
          targetSdk=36
          Legacy v2.4/v2.5 PageCurl runtime disabled
          Chapter boundary animation-free stabilization preserved
          EPUB viewport/overview scale normalized
          Scroll and Page font scaling use WebView textZoom
          Normal screens use systemBars + displayCutout insets
          Reader chrome uses systemBars + displayCutout safe insets
          debug/release compile + lint PASS
          Google Auth / Drive appDataFolder / Smart Sync guards PASS
          Coming Soon 3-source feed guards PASS
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v32-root-fixes-unsigned
          path: out/*
          retention-days: 2
