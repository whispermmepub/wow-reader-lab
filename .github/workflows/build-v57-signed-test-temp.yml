name: Build production-signed v57 test APK

on:
  push:
    branches: [feature/v57-dictionary-reader-polish]
    paths:
      - '.github/workflows/build-v57-signed-test-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WOW_RELEASE_STORE_PASSWORD: ${{ secrets.WOW_RELEASE_STORE_PASSWORD }}
      WOW_RELEASE_KEY_ALIAS: ${{ secrets.WOW_RELEASE_KEY_ALIAS }}
      WOW_RELEASE_KEY_PASSWORD: ${{ secrets.WOW_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v57-dictionary-reader-polish

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true

      - name: Prepare protected production signing identity
        env:
          WOW_RELEASE_KEYSTORE_BASE64: ${{ secrets.WOW_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WOW_RELEASE_KEYSTORE_BASE64"
          test -n "$WOW_RELEASE_STORE_PASSWORD"
          test -n "$WOW_RELEASE_KEY_ALIAS"
          test -n "$WOW_RELEASE_KEY_PASSWORD"
          WOW_RELEASE_STORE_FILE="$RUNNER_TEMP/wow-reader-production.jks"
          printf '%s' "$WOW_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$WOW_RELEASE_STORE_FILE"
          chmod 600 "$WOW_RELEASE_STORE_FILE"
          echo "WOW_RELEASE_STORE_FILE=$WOW_RELEASE_STORE_FILE" >> "$GITHUB_ENV"

      - name: Verify v57 source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 57" app/build.gradle
          grep -q "versionName '2.18.7'" app/build.gradle
          grep -q 'Small Grid' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'Large Grid' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'ScaleGestureDetector' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'KindleDictionaryStore' app/src/main/java/com/whisper/wowreader/DictionaryDialog.java
          test -s app/src/main/assets/dictionary/myanmar_spelling.txt

      - name: Build signed release
        run: gradle :app:clean :app:assembleRelease --stacktrace

      - name: Verify production-signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='57'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.7'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee WoW-Reader-v2.18.7-v57-signature.txt
          grep -qi '29fca29f8db184aaf51335efbea8c50d51769d7748ae535617c2479e3989aca5' WoW-Reader-v2.18.7-v57-signature.txt
          cp "$APK" WoW-Reader-v2.18.7-v57-production-signed-test.apk
          sha256sum WoW-Reader-v2.18.7-v57-production-signed-test.apk > WoW-Reader-v2.18.7-v57-production-signed-test.sha256.txt

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.18.7-v57-production-signed-test
          path: |
            WoW-Reader-v2.18.7-v57-production-signed-test.apk
            WoW-Reader-v2.18.7-v57-production-signed-test.sha256.txt
            WoW-Reader-v2.18.7-v57-signature.txt
          if-no-files-found: error
          retention-days: 30
