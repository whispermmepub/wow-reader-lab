name: Build WoW Reader v2.19.3 v63 release candidate

on:
  push:
    branches: [fix/v63-stability-scalable-library]
    paths:
      - 'release-v63-trigger.txt'
      - '.github/workflows/build-v63.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify v63 release configuration and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "versionCode 63" app/build.gradle
          grep -q "versionName '2.19.3'" app/build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "minSdk 23" app/build.gradle
          test -s app/google-services.json
          grep -q '"package_name": "com.whisper.wowreader"' app/google-services.json
          grep -qi '2117d31e01eb24eae3fe4a2688c8c712cd7671f1' app/google-services.json
          for f in ReaderStateDb.java EpubProgressModel.java FileIdentityUtil.java ReadingRecapImageRenderer.java; do
            test -s "app/src/main/java/com/whisper/wowreader/$f"
          done
          test -s app/src/main/java/com/whisper/wowreader/MainActivity.java
          test -s app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          test -s app/src/main/res/xml/share_paths.xml
          ! grep -q 'GoogleAutoSync' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'launchMode="singleTop"' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SEND' app/src/main/AndroidManifest.xml

      - name: Build and lint
        run: gradle :app:clean :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace

      - name: Verify unsigned v63 artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.whisper.wowreader'" /tmp/badging.txt
          grep -q "versionCode='63'" /tmp/badging.txt
          grep -q "versionName='2.19.3'" /tmp/badging.txt
          grep -q "sdkVersion:'23'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt

      - name: Collect unsigned release and reports
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v2.19.3-v63-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-v2.19.3-v63-unsigned.aab
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar
          cp app/build/reports/lint-results-release.html lint-results-release.html
          sha256sum WoW-Reader-v2.19.3-v63-unsigned.apk WoW-Reader-v2.19.3-v63-unsigned.aab > WoW-Reader-v2.19.3-v63-unsigned-SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_COMMIT.txt

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.19.3-v63-unsigned
          path: |
            WoW-Reader-v2.19.3-v63-unsigned.apk
            WoW-Reader-v2.19.3-v63-unsigned.aab
            WoW-Reader-v2.19.3-v63-unsigned-SHA256SUMS.txt
            SOURCE_COMMIT.txt
            lint-results-release.html
            apksigner.jar
          if-no-files-found: error
          retention-days: 14
