name: Build WoW Reader release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tools/**'
      - '.github/workflows/build-production.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Read and verify release configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "minSdk 23" app/build.gradle
          test -s app/google-services.json
          grep -q '"package_name": "com.whisper.wowreader"' app/google-services.json
          grep -qi '2117d31e01eb24eae3fe4a2688c8c712cd7671f1' app/google-services.json

          VERSION_CODE=$(sed -n "s/.*versionCode[[:space:]]\+\([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n1)
          VERSION_NAME=$(sed -n "s/.*versionName[[:space:]]\+'\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "$VERSION_CODE" -gt 0
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: 100k contract tests
        run: bash tools/run-contract-tests.sh

      - name: Build and lint
        run: gradle :app:clean :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace

      - name: Verify unsigned release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.whisper.wowreader'" /tmp/badging.txt
          grep -q "versionCode='$VERSION_CODE'" /tmp/badging.txt
          grep -q "versionName='$VERSION_NAME'" /tmp/badging.txt
          grep -q "sdkVersion:'23'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt

      - name: Collect release artifacts and reports
        shell: bash
        run: |
          set -euo pipefail
          BASE="WoW-Reader-v${VERSION_NAME}-v${VERSION_CODE}"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "${BASE}-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "${BASE}-unsigned.aab"
          cp app/build/reports/lint-results-release.html lint-results-release.html
          git rev-parse HEAD > SOURCE_COMMIT.txt
          sha256sum "${BASE}-unsigned.apk" "${BASE}-unsigned.aab" > "${BASE}-unsigned-SHA256SUMS.txt"

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-release-unsigned
          path: |
            WoW-Reader-v*-unsigned.apk
            WoW-Reader-v*-unsigned.aab
            WoW-Reader-v*-unsigned-SHA256SUMS.txt
            SOURCE_COMMIT.txt
            lint-results-release.html
          if-no-files-found: error
          retention-days: 14
