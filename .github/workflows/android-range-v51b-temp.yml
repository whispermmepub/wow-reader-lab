name: Verify Android 23 29 35 fresh install for v51 b

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-range-v51b-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-range-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            arch: x86
            profile: pixel_2
          - api: 29
            arch: x86_64
            profile: pixel_3a
          - api: 35
            arch: x86_64
            profile: pixel_6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build v51 debug
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare emulator verification script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify-range-v51.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=com.whisper.wowreader
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          adb uninstall "$PKG" >/dev/null 2>&1 || true
          adb install "$APK"
          adb logcat -c
          adb shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 5
          adb shell dumpsys package "$PKG" | grep -Fq 'versionCode=51'
          adb shell pidof "$PKG" >/dev/null
          adb shell run-as "$PKG" test -d files/library
          adb shell run-as "$PKG" test -d files/cover_cache
          LOG="$RUNNER_TEMP/range-logcat.txt"
          adb logcat -d > "$LOG"
          if grep -A25 -B5 'FATAL EXCEPTION' "$LOG" | grep -Fq "$PKG"; then
            grep -A40 -B10 'FATAL EXCEPTION' "$LOG" || true
            exit 1
          fi
          echo 'Fresh install launch PASS'
          SCRIPT
          chmod +x "$RUNNER_TEMP/verify-range-v51.sh"
      - name: Fresh install and launch API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash "$RUNNER_TEMP/verify-range-v51.sh"
