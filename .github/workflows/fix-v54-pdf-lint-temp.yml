name: Fix v54 PDF RecyclerView lint

on:
  push:
    branches: [fix/v54-reader-pdf-oem]
    paths: ['.github/workflows/fix-v54-pdf-lint-temp.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v54-reader-pdf-oem
      - name: Use current binding position for async PDF render
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/whisper/wowreader/PdfContinuousView.java')
          s=p.read_text()
          old='''        @Override public void onBindViewHolder(PageHolder holder, int position) {\n            holder.clearBitmap();\n            holder.boundPage = position;\n            ViewGroup.LayoutParams lp = holder.image.getLayoutParams();\n            lp.height = estimatedHeight();\n            holder.image.setLayoutParams(lp);\n            holder.image.setImageDrawable(null);\n            renderAsync(holder, position);\n        }\n'''
          new='''        @Override public void onBindViewHolder(PageHolder holder, int position) {\n            holder.clearBitmap();\n            int page = holder.getBindingAdapterPosition();\n            if (page == RecyclerView.NO_POSITION) return;\n            holder.boundPage = page;\n            ViewGroup.LayoutParams lp = holder.image.getLayoutParams();\n            lp.height = estimatedHeight();\n            holder.image.setLayoutParams(lp);\n            holder.image.setImageDrawable(null);\n            renderAsync(holder, page);\n        }\n'''
          if s.count(old)!=1: raise SystemExit('binding block mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/PdfContinuousView.java
          git commit -m 'Fix PDF continuous binding identity'
          git push origin HEAD:fix/v54-reader-pdf-oem
