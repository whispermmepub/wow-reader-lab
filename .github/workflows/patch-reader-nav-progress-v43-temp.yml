name: Patch WoW Reader Lab v43 navigation and progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-reader-nav-progress-v43-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Apply v43 navigation and progress patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rpath=Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java')
          mpath=Path('app/src/main/java/com/whisper/wowreader/MainActivity.java')
          gpath=Path('app/build.gradle')
          r=rpath.read_text()
          m=mpath.read_text()
          g=gpath.read_text()

          def once(text, old, new, label):
              c=text.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {c}')
              return text.replace(old,new,1)

          # v43 so the user's installed v42 can be updated in-place.
          g=once(g, "versionCode 42", "versionCode 43", 'versionCode')
          g=once(g, "versionName '2.17.2'", "versionName '2.17.3'", 'versionName')

          # Canonical progress storage keeps every surface on the same legacy-compatible key.
          progress_store='''package com.whisper.wowreader;\n\nimport android.content.SharedPreferences;\n\n/** Single source of truth for per-book reading percentage. */\nfinal class ReadingProgressStore {\n    private ReadingProgressStore() {}\n\n    static int get(SharedPreferences prefs, String fileName) {\n        if (prefs == null || fileName == null) return 0;\n        return clamp(prefs.getInt("percent_" + fileName, 0));\n    }\n\n    static void set(SharedPreferences prefs, String fileName, int percent) {\n        if (prefs == null || fileName == null) return;\n        prefs.edit().putInt("percent_" + fileName, clamp(percent)).apply();\n    }\n\n    static void remove(SharedPreferences prefs, String fileName) {\n        if (prefs == null || fileName == null) return;\n        prefs.edit().remove("percent_" + fileName).apply();\n    }\n\n    private static int clamp(int value) { return Math.max(0, Math.min(100, value)); }\n}\n'''
          Path('app/src/main/java/com/whisper/wowreader/ReadingProgressStore.java').write_text(progress_store)

          fields='''    private long readingSessionStartedElapsedMs = 0L;\n'''
          fields_new='''    private long readingSessionStartedElapsedMs = 0L;\n\n    // Footnote/endnote navigation is transient reading UI, not a new reading position.\n    private volatile boolean footnoteReturnArmed = false;\n    private volatile boolean footnoteNavigationActive = false;\n    private int footnoteReturnSpine = -1;\n    private int footnoteReturnProgressPermille = 0;\n    private int footnoteReturnPage = 1;\n    private String footnoteReturnSourceId = "";\n    private String footnoteReturnSourceUrl = "";\n    private long footnoteArmToken = 0L;\n'''
          r=once(r,fields,fields_new,'footnote fields')

          # Install a capture-phase link observer on each chapter document.
          r=once(r,"                applyReaderStyle(true);\n                webView.postDelayed(() -> {",
                 "                applyReaderStyle(true);\n                installReaderLinkNavigation();\n                webView.postDelayed(() -> {",'install link nav')

          client_end='''                }\n            }\n        };\n    }\n\n\n    private ReaderWebView createPreloadWebView() {'''
          nav_methods='''                }\n            }\n\n            @Override\n            public void doUpdateVisitedHistory(WebView view, String url, boolean isReload) {\n                super.doUpdateVisitedHistory(view, url, isReload);\n                if (view == webView) onReaderVisitedUrl(url);\n            }\n        };\n    }\n\n    private void installReaderLinkNavigation() {\n        if (webView == null) return;\n        String js = "(function(){try{" +\n                "if(window.__wowReaderLinkNavInstalled)return true;window.__wowReaderLinkNavInstalled=true;" +\n                "document.addEventListener('click',function(ev){try{" +\n                "var t=ev.target,a=t&&t.closest?t.closest('a[href]'):null;if(!a)return;" +\n                "var href=a.getAttribute('href')||'',ep=a.getAttribute('epub:type')||a.getAttribute('type')||'';" +\n                "try{ep=ep||a.getAttributeNS('http://www.idpf.org/2007/ops','type')||'';}catch(_e){}" +\n                "var role=a.getAttribute('role')||'',rel=a.getAttribute('rel')||'',cls=(typeof a.className==='string'?a.className:'');" +\n                "var sid='',n=a;for(var i=0;i<5&&n;i++,n=n.parentElement){if(n.id){sid=n.id;break;}}" +\n                "if(WoW.onReaderLinkTap(href,ep,role,rel,cls,sid)){ev.preventDefault();ev.stopImmediatePropagation();return false;}" +\n                "}catch(_e){}},true);return true;}catch(e){return false;}})()";\n        try { webView.evaluateJavascript(js, null); } catch (Exception ignored) {}\n    }\n\n    private static String navLower(String value) {\n        return value == null ? "" : value.toLowerCase(Locale.ROOT);\n    }\n\n    private boolean looksLikeFootnoteReference(String href, String epubType, String role, String rel, String cssClass) {\n        String meta = navLower(epubType + " " + role + " " + rel + " " + cssClass);\n        if (meta.contains("noteref") || meta.contains("doc-noteref") || meta.contains("footnote-ref") ||\n                meta.contains("footnoteref") || meta.contains("fnref") || meta.contains("endnote-ref")) return true;\n        String h = navLower(href);\n        int hash = h.indexOf('#');\n        String frag = hash >= 0 ? h.substring(hash + 1) : "";\n        return frag.startsWith("fn") || frag.startsWith("ftn") || frag.contains("footnote") ||\n                frag.startsWith("note-") || frag.startsWith("note_") || frag.startsWith("endnote");\n    }\n\n    private boolean looksLikeFootnoteBacklink(String href, String epubType, String role, String rel, String cssClass) {\n        String meta = navLower(epubType + " " + role + " " + rel + " " + cssClass);\n        if (meta.contains("backlink") || meta.contains("doc-backlink") || meta.contains("footnote-back") ||\n                meta.contains("note-back") || meta.contains("fnback")) return true;\n        String source = footnoteReturnSourceId == null ? "" : footnoteReturnSourceId.trim();\n        if (!source.isEmpty() && href != null) {\n            int hash = href.indexOf('#');\n            if (hash >= 0 && hash + 1 < href.length()) {\n                String fragment = Uri.decode(href.substring(hash + 1));\n                if (source.equals(fragment)) return true;\n            }\n        }\n        return false;\n    }\n\n    private synchronized void armFootnoteReturn(String sourceId) {\n        if (webView == null || spine.isEmpty() || footnoteNavigationActive) return;\n        footnoteReturnSpine = currentSpine;\n        footnoteReturnProgressPermille = currentProgressPermille;\n        footnoteReturnPage = currentPageInChapter;\n        footnoteReturnSourceId = sourceId == null ? "" : sourceId;\n        String url = webView.getUrl();\n        footnoteReturnSourceUrl = url == null ? "" : url;\n        footnoteReturnArmed = true;\n        long token = ++footnoteArmToken;\n        webView.postDelayed(() -> {\n            synchronized (BookReaderActivity.this) {\n                if (token == footnoteArmToken && footnoteReturnArmed && !footnoteNavigationActive)\n                    footnoteReturnArmed = false;\n            }\n        }, 20000L);\n    }\n\n    private synchronized void onReaderVisitedUrl(String url) {\n        if (!footnoteReturnArmed || footnoteNavigationActive || url == null || url.isEmpty()) return;\n        if (!url.equals(footnoteReturnSourceUrl)) {\n            footnoteNavigationActive = true;\n            footnoteReturnArmed = false;\n        }\n    }\n\n    private void restoreFootnoteReturn() {\n        runOnUiThread(() -> {\n            if ((!footnoteNavigationActive && !footnoteReturnArmed) || webView == null || spine.isEmpty()) return;\n            int targetSpine = Math.max(0, Math.min(spine.size() - 1, footnoteReturnSpine));\n            int targetProgress = Math.max(0, Math.min(1000, footnoteReturnProgressPermille));\n            int targetPage = Math.max(1, footnoteReturnPage);\n            footnoteNavigationActive = false;\n            footnoteReturnArmed = false;\n            footnoteArmToken++;\n\n            String expected = Uri.fromFile(spine.get(targetSpine)).toString();\n            String actual = webView.getUrl();\n            if (actual != null) { int hash = actual.indexOf('#'); if (hash >= 0) actual = actual.substring(0, hash); }\n            boolean sameDocument = expected.equals(actual);\n            currentSpine = targetSpine;\n            currentProgressPermille = targetProgress;\n\n            if (!sameDocument) {\n                saveEpubStateOnly();\n                loadCurrentEpubChapter();\n                return;\n            }\n\n            if ("page".equals(readingMode)) {\n                final int pageZero = targetPage - 1;\n                String jump = "(function(){var st=window.__wowPageEngine;if(!st||st.mode!=='page')return false;" +\n                        "st.page=st.clamp(" + pageZero + ",0,(st.count||1)-1);st.apply(false);st.report();return true;})()";\n                try { webView.evaluateJavascript(jump, null); } catch (Exception ignored) {}\n            } else {\n                String jump = "(function(){var h=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);" +\n                        "window.scrollTo(0,h*" + (targetProgress / 1000.0) + ");return true;})()";\n                try { webView.evaluateJavascript(jump, null); } catch (Exception ignored) {}\n            }\n            updateEpubProgress(targetProgress);\n            saveEpubStateOnly();\n        });\n    }\n\n\n    private ReaderWebView createPreloadWebView() {'''
          r=once(r,client_end,nav_methods,'web client end')

          # Footnote/endnote pages must never overwrite the normal reading position/progress.
          r=once(r,'        prefs.edit().putInt("percent_" + bookFile.getName(), percent).apply();',
                 '        if (!footnoteNavigationActive) ReadingProgressStore.set(prefs, bookFile.getName(), percent);','progress write')
          r=once(r,'    private void saveEpubStateOnly() {\n        prefs.edit()',
                 '    private void saveEpubStateOnly() {\n        if (footnoteNavigationActive) return;\n        prefs.edit()','state suppress')

          bridge_ctor='''        ReaderBridge(WebView owner) {\n            this.owner = owner;\n        }\n\n        @JavascriptInterface\n        public void onSelection'''
          bridge_new='''        ReaderBridge(WebView owner) {\n            this.owner = owner;\n        }\n\n        @JavascriptInterface\n        public boolean onReaderLinkTap(String href, String epubType, String role, String rel, String cssClass, String sourceId) {\n            if (owner != webView) return false;\n            if (looksLikeFootnoteReference(href, epubType, role, rel, cssClass)) {\n                armFootnoteReturn(sourceId);\n                return false;\n            }\n            if (footnoteNavigationActive && looksLikeFootnoteBacklink(href, epubType, role, rel, cssClass)) {\n                restoreFootnoteReturn();\n                return true;\n            }\n            return false;\n        }\n\n        @JavascriptInterface\n        public void onSelection'''
          r=once(r,bridge_ctor,bridge_new,'bridge link tap')

          r=once(r,'    @Override\n    public void onBackPressed() {\n        if (!isPdf) saveEpubState();',
                 '    @Override\n    public void onBackPressed() {\n        if (!isPdf && footnoteNavigationActive) { restoreFootnoteReturn(); return; }\n        if (!isPdf) saveEpubState();','reader back footnote')

          # Main/Home: refresh the whole Home header exactly once when returning from Reader.
          m=once(m,'    private boolean homeMode = true;\n',
                 '    private boolean homeMode = true;\n    private boolean readerUiRefreshPending = false;\n','main refresh field')
          old_resume='''    @Override protected void onResume() {\n        super.onResume();\n        if (libraryRecycler != null) refreshLibrary();\n        maybeAutoGoogleSync();\n    }'''
          new_resume='''    @Override protected void onResume() {\n        super.onResume();\n        if (readerUiRefreshPending) {\n            readerUiRefreshPending = false;\n            if (homeMode) buildUi();\n            else if (libraryRecycler != null) refreshLibrary();\n        } else if (libraryRecycler != null) refreshLibrary();\n        maybeAutoGoogleSync();\n    }'''
          m=once(m,old_resume,new_resume,'main onResume')
          old_open='''    private void openBook(File file){prefs.edit().putLong("last_opened_"+file.getName(),System.currentTimeMillis()).apply();Intent i=new Intent(this,BookReaderActivity.class);i.putExtra("path",file.getAbsolutePath());startActivity(i);overridePendingTransition(android.R.anim.fade_in,android.R.anim.fade_out);}'''
          new_open='''    private void openBook(File file){prefs.edit().putLong("last_opened_"+file.getName(),System.currentTimeMillis()).apply();readerUiRefreshPending=true;Intent i=new Intent(this,BookReaderActivity.class);i.putExtra("path",file.getAbsolutePath());startActivity(i);overridePendingTransition(android.R.anim.fade_in,android.R.anim.fade_out);}'''
          m=once(m,old_open,new_open,'openBook refresh marker')

          # Every visible progress label/filter now goes through one helper.
          m=m.replace('prefs.getInt("percent_" + f.getName(), 0)', 'ReadingProgressStore.get(prefs, f.getName())')
          m=m.replace('prefs.getInt("percent_" + file.getName(), 0)', 'ReadingProgressStore.get(prefs, file.getName())')
          m=m.replace('prefs.getInt("percent_"+file.getName(),0)', 'ReadingProgressStore.get(prefs, file.getName())')

          rpath.write_text(r)
          mpath.write_text(m)
          gpath.write_text(g)
          PY

          grep -q "versionCode 43" app/build.gradle
          grep -q "versionName '2.17.3'" app/build.gradle
          grep -q 'onReaderLinkTap' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'footnoteNavigationActive' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'ReadingProgressStore.set' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'readerUiRefreshPending' app/src/main/java/com/whisper/wowreader/MainActivity.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingProgressStore.java
          ! grep -q 'prefs.getInt("percent_' app/src/main/java/com/whisper/wowreader/MainActivity.java
          git diff --check
      - name: Build and lint patched Lab
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintDebug :app:lintRelease --stacktrace
      - name: Smoke check v43
        shell: bash
        run: |
          set -euo pipefail
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          RELEASE=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$DEBUG"
          test -s "$RELEASE"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          for APK in "$DEBUG" "$RELEASE"; do
            "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
            "$AAPT" dump badging "$APK" | grep -q "versionCode='43'"
            "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.3'"
            "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          done
      - name: Commit verified v43 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app
          git diff --cached --check
          git commit -m 'Fix footnote return and unify reading progress in Lab v43'
          git push origin HEAD:main
