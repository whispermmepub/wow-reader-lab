name: Patch v54 reader PDF and OEM compatibility

on:
  push:
    branches: [fix/v54-reader-pdf-oem]
    paths:
      - 'tools/patch_v54.py'
      - '.github/workflows/patch-v54-reader-pdf-oem-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v54-reader-pdf-oem
      - name: Apply v54 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/patch_v54.py')
          s=p.read_text()
          s=s.replace('    pdf_setup + "    private void openEpub() {",\n', '    pdf_setup,\n')
          s=s.replace('# replace_between retains end marker; replacement above includes it, so remove duplicated marker once.\nreader = reader.replace("    private void openEpub() {    private void openEpub() {", "    private void openEpub() {", 1)\n\n', '')
          p.write_text(s)
          PY
          python3 tools/patch_v54.py
          grep -q "versionCode 54" app/build.gradle
          grep -q "versionName '2.18.4'" app/build.gradle
          grep -q "BookImportTypeDetector.resolveExtension" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "saveReaderLocationDurable" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "PdfContinuousView" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "pdf_reading_mode" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "extra slow" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git diff --check
      - name: Commit patched v54 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app tools/patch_v54.py .github/workflows/build-apk.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix themed metadata OEM resume and add PDF scroll auto-scroll'
          git push origin HEAD:fix/v54-reader-pdf-oem
