name: Build WoW Reader v2.19.2 v62 unsigned release

on:
  push:
    branches: [release/v62-google-signin]
    paths:
      - 'release-v62-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Verify v62 release configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "versionCode 62" app/build.gradle
          grep -q "versionName '2.19.2'" app/build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          test -s app/google-services.json
          grep -q '"package_name": "com.whisper.wowreader"' app/google-services.json
          grep -qi '2117d31e01eb24eae3fe4a2688c8c712cd7671f1' app/google-services.json
          test -s app/src/main/java/com/whisper/wowreader/MainActivity.java
          test -s app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          test -s app/src/main/res/xml/share_paths.xml

      - name: Build and lint
        run: gradle :app:clean :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace

      - name: Verify unsigned v62 artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='62'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.19.2'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"

      - name: Collect unsigned release
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v2.19.2-v62-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-v2.19.2-v62-unsigned.aab
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar
          sha256sum WoW-Reader-v2.19.2-v62-unsigned.apk WoW-Reader-v2.19.2-v62-unsigned.aab > WoW-Reader-v2.19.2-v62-unsigned-SHA256SUMS.txt

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.19.2-v62-unsigned
          path: |
            WoW-Reader-v2.19.2-v62-unsigned.apk
            WoW-Reader-v2.19.2-v62-unsigned.aab
            WoW-Reader-v2.19.2-v62-unsigned-SHA256SUMS.txt
            apksigner.jar
          if-no-files-found: error
          retention-days: 14
