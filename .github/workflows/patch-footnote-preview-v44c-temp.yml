name: Patch WoW Reader Lab v44 footnote preview final retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-footnote-preview-v44c-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Apply v44 footnote preview patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rpath=Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java')
          gpath=Path('app/build.gradle')
          r=rpath.read_text(); g=gpath.read_text()
          def once(text, old, new, label):
              c=text.count(old)
              if c != 1: raise SystemExit(f'{label}: expected 1 match, got {c}')
              return text.replace(old,new,1)
          g=once(g,'versionCode 43','versionCode 44','versionCode')
          g=once(g,"versionName '2.17.3'","versionName '2.17.4'",'versionName')
          r=once(r,'    private long footnoteArmToken = 0L;\n','    private long footnoteArmToken = 0L;\n    private Dialog footnotePreviewDialog = null;\n    private String footnotePreviewHref = "";\n    private String footnotePreviewLabel = "";\n','fields')
          old='''                "var role=a.getAttribute('role')||'',rel=a.getAttribute('rel')||'',cls=(typeof a.className==='string'?a.className:'');" +\n                "var sid='',n=a;for(var i=0;i<5&&n;i++,n=n.parentElement){if(n.id){sid=n.id;break;}}" +\n                "if(WoW.onReaderLinkTap(href,ep,role,rel,cls,sid)){ev.preventDefault();ev.stopImmediatePropagation();return false;}" +'''
          new='''                "var role=a.getAttribute('role')||'',rel=a.getAttribute('rel')||'',cls=(typeof a.className==='string'?a.className:'');" +\n                "var sid='',n=a;for(var i=0;i<5&&n;i++,n=n.parentElement){if(n.id){sid=n.id;break;}}" +\n                "var label=(a.textContent||'').replace(/\\s+/g,' ').trim();" +\n                "if(WoW.onReaderLinkTap(href,ep,role,rel,cls,sid,label)){ev.preventDefault();ev.stopImmediatePropagation();return false;}" +'''
          r=once(r,old,new,'listener')
          anchor='''    private static String navLower(String value) {\n        return value == null ? "" : value.toLowerCase(Locale.ROOT);\n    }\n'''
          methods='''    private void requestFootnotePreview(String href, String label) {\n        if (webView == null || href == null || href.trim().isEmpty()) return;\n        footnotePreviewHref = href.trim();\n        footnotePreviewLabel = label == null ? "" : label.trim();\n        runOnUiThread(() -> {\n            if (webView == null) return;\n            String script = "(function(){var raw=" + jsQuote(footnotePreviewHref) + ";try{" +\n                    "var abs=new URL(raw,location.href).href;var u=new URL(abs);var frag='';" +\n                    "try{frag=decodeURIComponent((u.hash||'').replace(/^#/,''));}catch(_e){frag=(u.hash||'').replace(/^#/,'');}" +\n                    "var textOf=function(doc){try{var n=frag?doc.getElementById(frag):null;if(!n&&frag){var named=doc.getElementsByName(frag);if(named&&named.length)n=named[0];}" +\n                    "if(!n)return '';var c=n.cloneNode(true);var backs=c.querySelectorAll('a[role=doc-backlink],a[href*=ref],a[href*=back]');for(var i=0;i<backs.length;i++)backs[i].remove();" +\n                    "return (c.innerText||c.textContent||'').replace(/\\s+/g,' ').trim();}catch(e){return '';}};" +\n                    "var here=location.href.split('#')[0],there=abs.split('#')[0];" +\n                    "if(here===there){WoW.onFootnotePreviewResolved(abs,textOf(document));return true;}" +\n                    "fetch(there).then(function(x){return x.text();}).then(function(t){var d=(new DOMParser()).parseFromString(t,'text/html');WoW.onFootnotePreviewResolved(abs,textOf(d));})" +\n                    ".catch(function(){WoW.onFootnotePreviewResolved(abs,'');});return true;}catch(e){WoW.onFootnotePreviewResolved(raw||'','');return false;}})()";\n            try { webView.evaluateJavascript(script, null); } catch (Exception ignored) { showFootnotePreview(footnotePreviewHref, footnotePreviewLabel, ""); }\n        });\n    }\n\n    private void showFootnotePreview(String href, String label, String bodyText) {\n        if (isFinishing()) return;\n        if (footnotePreviewDialog != null) { try { footnotePreviewDialog.dismiss(); } catch (Exception ignored) {} footnotePreviewDialog = null; }\n        final Dialog dialog = new Dialog(this); footnotePreviewDialog = dialog; dialog.requestWindowFeature(Window.FEATURE_NO_TITLE); dialog.setCanceledOnTouchOutside(true);\n        LinearLayout card = new LinearLayout(this); card.setOrientation(LinearLayout.VERTICAL); card.setPadding(dp(20),dp(16),dp(20),dp(18)); card.setBackground(glassPanel(readerPanelBase(),dp(24),readerPanelStroke())); card.setElevation(dp(14));\n        LinearLayout head=new LinearLayout(this); head.setOrientation(LinearLayout.HORIZONTAL); head.setGravity(Gravity.CENTER_VERTICAL);\n        TextView title=new TextView(this); String cleanLabel=label==null?"":label.trim(); title.setText(cleanLabel.isEmpty()?"Footnote":"Footnote "+cleanLabel); title.setTextSize(17f); title.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD); title.setTextColor(readerPanelText()); head.addView(title,new LinearLayout.LayoutParams(0,dp(42),1f));\n        TextView close=new TextView(this); close.setText("×"); close.setTextSize(25f); close.setTextColor(readerPanelSubText()); close.setGravity(Gravity.CENTER); close.setContentDescription("Close footnote"); close.setOnClickListener(v -> dialog.dismiss()); head.addView(close,new LinearLayout.LayoutParams(dp(42),dp(42))); card.addView(head);\n        ScrollView scroll=new ScrollView(this); scroll.setVerticalScrollBarEnabled(false); TextView body=new TextView(this); String text=bodyText==null?"":bodyText.replaceAll("\\s+"," ").trim(); if(text.length()>6000)text=text.substring(0,6000).trim()+"…"; if(text.isEmpty())text="Open the footnote to read the full note."; body.setText(text); body.setTextSize(15.5f); body.setTextColor(readerPanelText()); body.setLineSpacing(dp(3),1.08f); body.setPadding(dp(2),dp(4),dp(2),dp(10)); scroll.addView(body,new ScrollView.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT)); int maxBody=Math.max(dp(120),(int)(getResources().getDisplayMetrics().heightPixels*0.38f)); card.addView(scroll,new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,maxBody));\n        LinearLayout actions=new LinearLayout(this); actions.setOrientation(LinearLayout.HORIZONTAL); actions.setGravity(Gravity.END|Gravity.CENTER_VERTICAL); actions.setPadding(0,dp(10),0,0);\n        TextView dismiss=new TextView(this); dismiss.setText("Close"); dismiss.setTextSize(14f); dismiss.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD); dismiss.setTextColor(readerPanelSubText()); dismiss.setGravity(Gravity.CENTER); dismiss.setPadding(dp(16),0,dp(16),0); dismiss.setOnClickListener(v -> dialog.dismiss()); actions.addView(dismiss,new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT,dp(44)));\n        TextView go=new TextView(this); go.setText("Go to note  ›"); go.setTextSize(14f); go.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD); go.setTextColor(readerAccent()); go.setGravity(Gravity.CENTER); go.setPadding(dp(18),0,dp(18),0); go.setBackground(glassPanel(readerSelectedSurface(),dp(20),readerPanelStroke())); go.setOnClickListener(v -> { dialog.dismiss(); navigateToFootnote(href); }); LinearLayout.LayoutParams goLp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT,dp(44)); goLp.leftMargin=dp(8); actions.addView(go,goLp); card.addView(actions);\n        dialog.setContentView(card); dialog.setOnDismissListener(d -> { if(footnotePreviewDialog==dialog)footnotePreviewDialog=null; }); dialog.show(); Window w=dialog.getWindow(); if(w!=null){w.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));w.addFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND);w.setDimAmount(0.30f);WindowManager.LayoutParams lp=w.getAttributes();lp.width=ViewGroup.LayoutParams.MATCH_PARENT;lp.height=ViewGroup.LayoutParams.WRAP_CONTENT;lp.gravity=Gravity.BOTTOM;w.setAttributes(lp);}\n    }\n\n    private void navigateToFootnote(String href) {\n        if(webView==null||href==null||href.trim().isEmpty())return; footnoteNavigationActive=true; footnoteReturnArmed=false; footnoteArmToken++; String script="(function(){try{location.href=new URL("+jsQuote(href.trim())+",location.href).href;return true;}catch(e){return false;}})()"; try{webView.evaluateJavascript(script,null);}catch(Exception ignored){}\n    }\n\n''' + anchor
          r=once(r,anchor,methods,'methods')
          oldb='''        @JavascriptInterface\n        public boolean onReaderLinkTap(String href, String epubType, String role, String rel, String cssClass, String sourceId) {\n            if (owner != webView) return false;\n            if (looksLikeFootnoteReference(href, epubType, role, rel, cssClass)) {\n                armFootnoteReturn(sourceId);\n                return false;\n            }\n            if (footnoteNavigationActive && looksLikeFootnoteBacklink(href, epubType, role, rel, cssClass)) {\n                restoreFootnoteReturn();\n                return true;\n            }\n            return false;\n        }\n'''
          newb='''        @JavascriptInterface\n        public boolean onReaderLinkTap(String href, String epubType, String role, String rel, String cssClass, String sourceId, String label) {\n            if(owner!=webView)return false; if(looksLikeFootnoteReference(href,epubType,role,rel,cssClass)){armFootnoteReturn(sourceId);requestFootnotePreview(href,label);return true;} if(footnoteNavigationActive&&looksLikeFootnoteBacklink(href,epubType,role,rel,cssClass)){restoreFootnoteReturn();return true;} return false;\n        }\n\n        @JavascriptInterface\n        public void onFootnotePreviewResolved(String href, String text) {\n            if(owner!=webView)return; final String target=(href==null||href.trim().isEmpty())?footnotePreviewHref:href.trim(); final String body=text==null?"":text; runOnUiThread(() -> showFootnotePreview(target,footnotePreviewLabel,body));\n        }\n'''
          r=once(r,oldb,newb,'bridge')
          rpath.write_text(r); gpath.write_text(g)
          PY
          grep -q 'versionCode 44' app/build.gradle
          grep -q "versionName '2.17.4'" app/build.gradle
          grep -q 'Go to note' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'onFootnotePreviewResolved' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'ReadingProgressStore.set' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'SwipeRefreshLayout' app/src/main/java/com/whisper/wowreader/MainActivity.java
          git diff --check
      - name: Build and lint v44
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace
      - name: Smoke check v44
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='44'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.4'"
      - name: Commit verified v44 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git diff --cached --quiet && exit 0
          git commit -m "Add Play Books style footnote preview"
          git push origin HEAD:main
