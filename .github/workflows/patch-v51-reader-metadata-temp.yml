name: Patch WoW Reader v2.18.1 v51 reader and metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v51-reader-metadata-temp.yml'
      - '.github/scripts/patch_v51.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Apply v51 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_v51.py
          git diff --check
          grep -q "versionCode 51" app/build.gradle
          grep -q "versionName '2.18.1'" app/build.gradle
          grep -q "Math.min(300, fontPercent + 10)" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "260, 280, 300" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "autoScrollManualReturnSpine" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "remembered >= 995 ? 0 : remembered" app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q "Edit title & author" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "library_metadata_custom_" app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q "Book details saved" app/src/main/java/com/whisper/wowreader/MainActivity.java
      - name: Build and lint
        run: gradle :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace
      - name: Smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='51'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.18.1'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/src/main/java/com/whisper/wowreader/MainActivity.java
          git commit -m 'Fix auto-scroll chapter return and add editable book metadata in v2.18.1 v51'
          git push origin HEAD:main
      - name: Collect artifacts
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-Lab-v2.18.1-v51-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-Lab-v2.18.1-v51-unsigned.aab
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-Lab-v2.18.1-v51-patch-build
          path: |
            WoW-Reader-Lab-v2.18.1-v51-unsigned.apk
            WoW-Reader-Lab-v2.18.1-v51-unsigned.aab
          if-no-files-found: error
          retention-days: 14
