name: WoWReader

options:
  bundleIdPrefix: com.whisper
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

targets:
  WoWReader:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WoWReader
    dependencies:
      - package: ZIPFoundation
    info:
      path: WoWReader/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whisper.wowreader
        PRODUCT_NAME: "WoW Reader"
        MARKETING_VERSION: 2.19.1
        CURRENT_PROJECT_VERSION: 61
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: NO

schemes:
  WoWReader:
    build:
      targets:
        WoWReader: all
    run:
      config: Debug
    archive:
      config: Release
